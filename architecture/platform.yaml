version: 1

# Inspectable inventory of the reusable product architecture. This manifest
# names composition and registry keys; TypeScript owns their behavior.
registries:
  languages:
    javascript:
      adapter: JavaScriptAdapter
  evaluators:
    - variableExists
    - variableEquals
    - outputEquals
    - outputContains
    - functionExists
    - functionReturns
  guidancePolicies:
    - guided
    - supported
    - independent
    - assessment
  telemetryEvents:
    - challenge_started
    - meaningful_parse_state
    - repeated_misconception
    - hint_level_used
    - run
    - check_attempt
    - completion
    - transfer_result
    - concept_check_result
    - time_to_first_success

contentContracts:
  executable: challenge
  project: orderedMilestones
  interview: challengeWithPattern
  knowledge: quizSetWithQuestions
  learningValidation:
    sequence: [guided-practice, transfer, concept-check]
    transferOutcomes: [independent, with-hints, failed]

runtimeIsolation:
  grantsAreExplicit: true
  defaults:
    network: false
    storage: false
    timers: false
    dom: false
  environments:
    worker: disposableWorker
    dom: opaqueOriginSandboxedIframe

surfaces:
  appShell: {}
  contentBrowser: {}
  challengeWorkspace:
    composes: [editor, hud, runtimePanel]
  editor: {}
  hud: {}
  runtimePanel: {}
  progressResults: {}
  questionSurface: {}

modes:
  learn:
    surface: challengeWorkspace
    defaultGuidancePolicy: guided
    hud: teaching
  projects:
    surface: challengeWorkspace
    defaultGuidancePolicy: supported
    hud: milestones
  interview:
    surface: challengeWorkspace
    defaultGuidancePolicy: independent
    hud: tests
  knowledge:
    surface: questionSurface
    defaultGuidancePolicy: assessment
