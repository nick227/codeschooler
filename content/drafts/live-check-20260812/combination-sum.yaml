            return;
          }
          for (let i = start; i < candidates.length; i++) {
            const value = candidates[i];
            if (value > remain) continue;
            path.push(value);
            dfs(i, remain - value, path);
            path.pop();
          }
        }
        dfs(0, target, []);
        return out;
      }

      function sortedCombos(candidates, target) {
        return combinationSum(candidates, target)
          .map((combo) => combo.slice().sort((a, b) => a - b))
          .sort((a, b) => a.join(",").localeCompare(b.join(",")));
      }
    acceptedSolutions:
      - name: sorted candidates first
        source: |
          function combinationSum(candidates, target) {
            const nums = candidates.slice().sort((a, b) => a - b);
            const out = [];
            function dfs(start, remain, path) {
              if (remain === 0) {
                out.push(path.slice());
                return;
              }
              for (let i = start; i < nums.length; i++) {
                if (nums[i] > remain) break;
                path.push(nums[i]);
                dfs(i, remain - nums[i], path);
                path.pop();
              }
            }
            dfs(0, target, []);
            return out;
          }

          function sortedCombos(candidates, target) {
            return combinationSum(candidates, target)
              .map((combo) => combo.slice().sort((a, b) => a - b))
              .sort((a, b) => a.join(",").localeCompare(b.join(",")));
          }
    rejectedSolutions:
      - name: empty only
        source: |
          function combinationSum(candidates, target) {
            return [];
          }

          function sortedCombos(candidates, target) {
            return combinationSum(candidates, target)
              .map((combo) => combo.slice().sort((a, b) => a - b))
              .sort((a, b) => a.join(",").localeCompare(b.join(",")));
          }
