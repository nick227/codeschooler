    acceptedSolutions:
      - name: interleave then split
        source: |
          function copyRandomList(head) {
            if (!head) return null;
            let node = head;
            while (node) {
              const clone = { val: node.val, next: node.next, random: null };
              node.next = clone;
              node = clone.next;
            }
            node = head;
            while (node) {
              if (node.random) node.next.random = node.random.next;
              node = node.next.next;
            }
            const newHead = head.next;
            node = head;
            while (node) {
              const clone = node.next;
              node.next = clone.next;
              clone.next = clone.next ? clone.next.next : null;
              node = node.next;
            }
            return newHead;
          }

