          while (node) {
            const clone = map.get(node);
            clone.next = node.next ? map.get(node.next) : null;
            clone.random = node.random ? map.get(node.random) : null;
            node = node.next;
          }
          return map.get(head);
        }

        function demoCopy() {
          const a = { val: 7, next: null, random: null };
          const b = { val: 13, next: null, random: null };
          const c = { val: 11, next: null, random: null };
          a.next = b;
          b.next = c;
          b.random = a;
          c.random = b;
          const copy = copyRandomList(a);
          if (!copy || copy === a || copy.next === b) return null;
          const out = [];
          let orig = a;
          let cloned = copy;
          while (orig && cloned) {
            if (cloned === orig) return null;
            out.push([
              cloned.val,
              cloned.random ? cloned.random.val : null,
              cloned.random === orig.random,
            ]);
            orig = orig.next;
            cloned = cloned.next;
          }
          return out;
        }
