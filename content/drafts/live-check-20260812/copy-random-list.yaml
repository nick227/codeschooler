        First pass: for each node, map.set(node, { val: node.val, next: null, random: null }).
    - level: 3
      message: >-
        Second pass: clone.next = map.get(node.next) || null; same for random. Return map.get(head).
    - level: 4
      message: |
        function copyRandomList(head) {
          if (!head) return null;
          const map = new Map();
          let node = head;
          while (node) {
            map.set(node, { val: node.val, next: null, random: null });
