id: js-interview-network-delay
revision: 1
title: Network Delay Time
summary: Compute the time for a signal to reach all nodes with Dijkstra-style relaxation.
difficulty: medium
pattern: shortest-path
challenge:
  id: js-interview-network-delay-001
  revision: 1
  language: javascript
  title: Network Delay Time
  level: 12
  difficultyScore: 65
  instruction: >-
    Times are directed edges `[from, to, weight]`. Complete
    `networkDelayTime(times, n, k)` so it returns how long it takes for a signal
    from node `k` to reach every node labeled `1..n`, or `-1` if impossible.
    A simple O(N^2) Dijkstra / repeated relaxation is fine.
  starterCode: |
    function networkDelayTime(times, n, k) {
      // Shortest paths from k to all nodes
    }
  skills: [javascript.graphs, javascript.algorithms_bfs, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: networkDelayTime}
    - {type: functionReturns, name: networkDelayTime, args: [[[2, 1, 1], [2, 3, 1], [3, 4, 1]], 4, 2], value: 2}
    - {type: functionReturns, name: networkDelayTime, args: [[[1, 2, 1]], 2, 1], value: 1}
    - {type: functionReturns, name: networkDelayTime, args: [[[1, 2, 1]], 2, 2], value: -1}
  hints:
    - level: 1
      message: Build an adjacency list of weighted outgoing edges.
    - level: 2
      message: Keep a distance array initialized to Infinity except distance[k] = 0.
    - level: 3
      message: Repeatedly relax edges until distances stabilize, or pick the unsettled node with smallest distance.
    - level: 4
      message: |
        function networkDelayTime(times, n, k) {
          const graph = Array.from({ length: n + 1 }, () => []);
          for (const [from, to, weight] of times) graph[from].push([to, weight]);
          const dist = new Array(n + 1).fill(Infinity);
          dist[k] = 0;
          const seen = new Array(n + 1).fill(false);
          for (let iter = 0; iter < n; iter++) {
            let node = -1;
            for (let i = 1; i <= n; i++) {
              if (!seen[i] && (node === -1 || dist[i] < dist[node])) node = i;
            }
            if (node === -1 || dist[node] === Infinity) break;
            seen[node] = true;
            for (const [to, weight] of graph[node]) {
              if (dist[node] + weight < dist[to]) dist[to] = dist[node] + weight;
            }
          }
          let best = 0;
          for (let i = 1; i <= n; i++) {
            if (dist[i] === Infinity) return -1;
            if (dist[i] > best) best = dist[i];
          }
          return best;
        }
