id: js-interview-sorted-squares
revision: 1
title: Sorted Squares
summary: Square a sorted array and return the squares in sorted order using two pointers or an explicit sort.
difficulty: easy
pattern: sorting
challenge:
  id: js-interview-sorted-squares-001
  revision: 1
  language: javascript
  title: Squares of a Sorted Array
  level: 10
  difficultyScore: 45
  instruction: >-
    Complete `sortedSquares(nums)` for a non-decreasing integer array that may
    include negatives. Return a new array of the squares sorted non-decreasing.
    Sorting after squaring is acceptable; two pointers from both ends is better.
  starterCode: |
    function sortedSquares(nums) {
      // Square then sort, or merge from both ends
    }
  skills: [javascript.algorithms_sorting_strategy, javascript.algorithms_two_pointers, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: sortedSquares}
    - {type: functionReturns, name: sortedSquares, args: [[-4, -1, 0, 3, 10]], value: [0, 1, 9, 16, 100]}
    - {type: functionReturns, name: sortedSquares, args: [[-7, -3, 2, 3, 11]], value: [4, 9, 9, 49, 121]}
    - {type: functionReturns, name: sortedSquares, args: [[1, 2, 3]], value: [1, 4, 9]}
  hints:
    - level: 1
      message: Squaring preserves magnitude; negatives become positive.
    - level: 2
      message: Map to squares then sort, or fill from the largest magnitude inward.
    - level: 3
      message: Compare Math.abs at left and right ends.
    - level: 4
      message: |
        function sortedSquares(nums) {
          return nums.map((n) => n * n).sort((a, b) => a - b);
        }
  reward: {xp: 40}
  requiresRun: false
  runtime: &workerRuntime
    environment: worker
    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function sortedSquares(nums) {
        return nums.map((n) => n * n).sort((a, b) => a - b);
      }
    acceptedSolutions:
      - name: two pointers
        source: |
          function sortedSquares(nums) {
            const out = new Array(nums.length);
            let left = 0;
            let right = nums.length - 1;
            let write = nums.length - 1;
            while (left <= right) {
              const leftSq = nums[left] * nums[left];
              const rightSq = nums[right] * nums[right];
              if (leftSq > rightSq) {
                out[write] = leftSq;
                left += 1;
              } else {
                out[write] = rightSq;
                right -= 1;
              }
              write -= 1;
            }
            return out;
          }
    rejectedSolutions:
      - name: squares unsorted
        source: |
          function sortedSquares(nums) {
            return nums.map((n) => n * n);
          }
