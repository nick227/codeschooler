id: arrays-objects-review
revision: 1
title: Arrays & Objects Review
description: Indexing, length, and property access after the collections lessons.
mode: practice
purpose: knowledge
questions:
  - id: arrays-index-001
    revision: 1
    type: predict-output
    prompt: What does `console.log(["red", "green", "blue"][0])` print?
    skills: [javascript.arrays]
    options:
      - {id: red, label: red}
      - {id: green, label: green}
      - {id: zero, label: "0"}
    answer:
      correctOptionIds: [red]
      explanation: Index 0 is the first element.

  - id: arrays-length-002
    revision: 1
    type: multiple-choice
    prompt: What is `[10, 20].length`?
    skills: [javascript.arrays]
    options:
      - {id: two, label: "2"}
      - {id: one, label: "1"}
      - {id: twenty, label: "20"}
    answer:
      correctOptionIds: [two]
      explanation: length counts how many elements the array currently holds.

  - id: objects-dot-003
    revision: 1
    type: predict-output
    prompt: >-
      What does this print? `const user = { name: "Ada" }; console.log(user.name);`
    skills: [javascript.objects]
    options:
      - {id: ada, label: Ada}
      - {id: name, label: name}
      - {id: undefined, label: undefined}
    answer:
      correctOptionIds: [ada]
      explanation: Dot notation reads the value stored under the name property.
