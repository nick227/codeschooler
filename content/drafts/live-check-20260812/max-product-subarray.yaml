  authoring:
    referenceSolution: |
      function maxProduct(nums) {
        let best = nums[0];
        let maxEnding = nums[0];
        let minEnding = nums[0];
        for (let i = 1; i < nums.length; i++) {
          const x = nums[i];
          const candidates = [x, maxEnding * x, minEnding * x];
          maxEnding = Math.max(...candidates);
          minEnding = Math.min(...candidates);
          best = Math.max(best, maxEnding);
        }
        return best;
      }
    acceptedSolutions:
      - name: swap on negative
        source: |
          function maxProduct(nums) {
            let best = nums[0];
            let maxEnding = nums[0];
            let minEnding = nums[0];
            for (let i = 1; i < nums.length; i++) {
              const x = nums[i];
              if (x < 0) {
                const tmp = maxEnding;
                maxEnding = minEnding;
                minEnding = tmp;
              }
              maxEnding = Math.max(x, maxEnding * x);
              minEnding = Math.min(x, minEnding * x);
              best = Math.max(best, maxEnding);
            }
            return best;
          }
    rejectedSolutions:
      - name: kadane sum style
        source: |
          function maxProduct(nums) {
            let best = nums[0];
            let current = nums[0];
            for (let i = 1; i < nums.length; i++) {
              current = Math.max(nums[i], current * nums[i]);
              best = Math.max(best, current);
            }
            return best;
          }
