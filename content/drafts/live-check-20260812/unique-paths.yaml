    }
  skills: [javascript.algorithms_dp, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: uniquePaths}
    - {type: functionReturns, name: uniquePaths, args: [3, 7], value: 28}
    - {type: functionReturns, name: uniquePaths, args: [3, 2], value: 3}
    - {type: functionReturns, name: uniquePaths, args: [1, 1], value: 1}
  hints:
    - level: 1
      message: Ways to reach a cell equal ways from above plus ways from the left.
    - level: 2
      message: First row and first column are all 1s.
    - level: 3
      message: Fill a 2D table or compress to one row.
    - level: 4
      message: |
        function uniquePaths(m, n) {
          const row = new Array(n).fill(1);
          for (let r = 1; r < m; r++) {
            for (let c = 1; c < n; c++) {
              row[c] += row[c - 1];
            }
          }
          return row[n - 1];
        }
