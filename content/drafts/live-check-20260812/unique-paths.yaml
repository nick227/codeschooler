  authoring:
    referenceSolution: |
      function uniquePaths(m, n) {
        const row = new Array(n).fill(1);
        for (let r = 1; r < m; r++) {
          for (let c = 1; c < n; c++) {
            row[c] += row[c - 1];
          }
        }
        return row[n - 1];
      }
    acceptedSolutions:
      - name: 2d table
        source: |
          function uniquePaths(m, n) {
            const dp = Array.from({ length: m }, () => new Array(n).fill(1));
            for (let r = 1; r < m; r++) {
              for (let c = 1; c < n; c++) {
                dp[r][c] = dp[r - 1][c] + dp[r][c - 1];
              }
            }
            return dp[m - 1][n - 1];
          }
    rejectedSolutions:
      - name: returns m times n
        source: |
          function uniquePaths(m, n) {
            return m * n;
          }
