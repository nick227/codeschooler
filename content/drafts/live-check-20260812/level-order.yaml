  hints:
    - level: 1
      message: Use a queue starting with the root.
    - level: 2
      message: For each level, process exactly queue.length nodes before moving on.
    - level: 3
      message: Push left then right children when enqueueing the next level.
    - level: 4
      message: |
        function levelOrder(root) {
          if (!root) return [];
          const result = [];
          const queue = [root];
          while (queue.length) {
            const size = queue.length;
            const level = [];
            for (let i = 0; i < size; i++) {
              const node = queue.shift();
              level.push(node.val);
              if (node.left) queue.push(node.left);
              if (node.right) queue.push(node.right);
            }
            result.push(level);
          }
          return result;
        }

        function demoLevels() {
