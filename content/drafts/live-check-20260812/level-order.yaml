    acceptedSolutions:
      - name: same BFS with for-of size snapshot
        source: |
          function levelOrder(root) {
            if (!root) return [];
            const result = [];
            let layer = [root];
            while (layer.length) {
              result.push(layer.map((node) => node.val));
              const next = [];
              for (const node of layer) {
                if (node.left) next.push(node.left);
                if (node.right) next.push(node.right);
              }
              layer = next;
            }
            return result;
          }

          function demoLevels() {
            const root = {
              val: 1,
              left: { val: 2, left: null, right: null },
              right: {
                val: 3,
                left: { val: 4, left: null, right: null },
                right: null,
              },
            };
            return levelOrder(root);
          }
    rejectedSolutions:
      - name: flat preorder
        source: |
          function levelOrder(root) {
            const out = [];
            function walk(node) {
              if (!node) return;
              out.push(node.val);
              walk(node.left);
              walk(node.right);
            }
            walk(root);
            return out;
          }

          function demoLevels() {
            const root = {
              val: 1,
              left: { val: 2, left: null, right: null },
              right: {
                val: 3,
                left: { val: 4, left: null, right: null },
                right: null,
              },
            };
            return levelOrder(root);
          }
