    acceptedSolutions:
      - name: count kept then subtract
        source: |
          function eraseOverlapIntervals(intervals) {
            if (!intervals.length) return 0;
            const sorted = intervals.slice().sort((a, b) => a[1] - b[1]);
            let end = -Infinity;
            let kept = 0;
            for (const [start, finish] of sorted) {
              if (start >= end) {
                kept += 1;
                end = finish;
              }
            }
            return intervals.length - kept;
          }
    rejectedSolutions:
      - name: sort by start only keep first
        source: |
          function eraseOverlapIntervals(intervals) {
            if (!intervals.length) return 0;
            const sorted = intervals.slice().sort((a, b) => a[0] - b[0]);
            let end = sorted[0][1];
            let removed = 0;
            for (let i = 1; i < sorted.length; i++) {
              if (sorted[i][0] < end) removed += 1;
              else end = sorted[i][1];
            }
            return removed;
          }
