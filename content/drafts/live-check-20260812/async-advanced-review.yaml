id: async-advanced-review
revision: 1
title: Async Advanced Review
description: Check then-chains, Promise.all, and await error fallbacks.
mode: practice
purpose: knowledge
questions:
  - id: async-then-001
    revision: 1
    type: multiple-choice
    prompt: "`promise.then((value) => value + 1)` returns..."
    skills: [javascript.promises]
    options:
      - {id: next, label: A new Promise that resolves to the transformed value}
      - {id: num, label: The number value + 1 immediately as a plain number}
      - {id: void, label: undefined always}
    answer:
      correctOptionIds: [next]
      explanation: then always returns a Promise so async work can keep chaining.

  - id: async-all-002
    revision: 1
    type: true-false
    prompt: "`Promise.all([p1, p2])` fulfills with an array of results when every input promise fulfills."
    skills: [javascript.promises, javascript.async_composition]
    answer:
      value: true
      explanation: all waits for every promise; one rejection rejects the combined promise.

  - id: async-safe-003
    revision: 1
    type: multiple-choice
    prompt: Wrapping `await promise` in try/catch is useful because...
    skills: [javascript.async_await, javascript.error_handling]
    options:
      - {id: fallback, label: Rejected promises can be handled locally with a fallback}
      - {id: faster, label: It makes every Promise resolve twice as fast}
      - {id: sync, label: It turns async code into blocking CPU loops}
    answer:
      correctOptionIds: [fallback]
      explanation: await rethrows rejections into the surrounding async function.

  - id: async-reject-004
    revision: 1
    type: predict-output
    prompt: >-
      What does this print?
      `(async () => { try { await Promise.reject(new Error("x")); console.log("ok"); } catch { console.log("nope"); } })();`
    skills: [javascript.async_await, javascript.error_handling]
    options:
      - {id: nope, label: nope}
      - {id: ok, label: ok}
      - {id: both, label: ok then nope}
    answer:
      correctOptionIds: [nope]
      explanation: The rejected promise jumps to catch, so only nope is logged.
