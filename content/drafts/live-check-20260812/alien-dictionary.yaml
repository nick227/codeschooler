    acceptedSolutions:
      - name: same with objects
        source: |
          function alienOrder(words) {
            const graph = {};
            const indegree = {};
            for (const word of words) {
              for (const ch of word) {
                if (!graph[ch]) graph[ch] = new Set();
                if (indegree[ch] === undefined) indegree[ch] = 0;
              }
            }
            for (let i = 0; i < words.length - 1; i++) {
              const a = words[i];
              const b = words[i + 1];
              let found = false;
              for (let j = 0; j < Math.min(a.length, b.length); j++) {
                if (a[j] !== b[j]) {
                  if (!graph[a[j]].has(b[j])) {
                    graph[a[j]].add(b[j]);
                    indegree[b[j]] += 1;
                  }
                  found = true;
                  break;
                }
              }
              if (!found && a.length > b.length) return "";
            }
            const ready = Object.keys(indegree).filter((ch) => indegree[ch] === 0).sort();
            let order = "";
            while (ready.length) {
              const ch = ready.shift();
              order += ch;
              for (const next of graph[ch]) {
                indegree[next] -= 1;
                if (indegree[next] === 0) {
                  ready.push(next);
                  ready.sort();
                }
              }
            }
            return order.length === Object.keys(indegree).length ? order : "";
          }
    rejectedSolutions:
      - name: sorted unique letters only
        source: |
          function alienOrder(words) {
            return [...new Set(words.join(""))].sort().join("");
          }
