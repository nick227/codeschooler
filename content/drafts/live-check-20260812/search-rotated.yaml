    acceptedSolutions:
      - name: find pivot then binary
        source: |
          function search(nums, target) {
            function findMinIndex() {
              let left = 0;
              let right = nums.length - 1;
              while (left < right) {
                const mid = Math.floor((left + right) / 2);
                if (nums[mid] > nums[right]) left = mid + 1;
                else right = mid;
              }
              return left;
            }
            function binary(lo, hi) {
              while (lo <= hi) {
                const mid = Math.floor((lo + hi) / 2);
                if (nums[mid] === target) return mid;
                if (nums[mid] < target) lo = mid + 1;
                else hi = mid - 1;
              }
              return -1;
            }
            const pivot = findMinIndex();
            const leftHit = binary(0, pivot - 1);
            if (leftHit !== -1) return leftHit;
            return binary(pivot, nums.length - 1);
          }
    rejectedSolutions:
      - name: only checks ends
        source: |
          function search(nums, target) {
            if (nums[0] === target) return 0;
            if (nums[nums.length - 1] === target) return nums.length - 1;
            return -1;
          }
