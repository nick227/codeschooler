    acceptedSolutions:
      - name: Map counts
        source: |
          function characterReplacement(s, k) {
            const count = new Map();
            let left = 0;
            let maxFreq = 0;
            let best = 0;
            for (let right = 0; right < s.length; right++) {
              const ch = s[right];
              count.set(ch, (count.get(ch) || 0) + 1);
              maxFreq = Math.max(maxFreq, count.get(ch));
              while (right - left + 1 - maxFreq > k) {
                count.set(s[left], count.get(s[left]) - 1);
                left += 1;
              }
              best = Math.max(best, right - left + 1);
            }
            return best;
          }
    rejectedSolutions:
      - name: longest run without replacements
        source: |
          function characterReplacement(s) {
            let best = 0;
            let cur = 0;
            let prev = "";
            for (const ch of s) {
              if (ch === prev) cur += 1;
              else {
                prev = ch;
                cur = 1;
              }
              best = Math.max(best, cur);
            }
            return best;
          }
