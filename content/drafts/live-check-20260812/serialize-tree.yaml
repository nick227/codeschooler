    acceptedSolutions:
      - name: preorder recursion
        source: |
          function serialize(root) {
            const out = [];
            function dfs(node) {
              if (!node) {
                out.push("null");
                return;
              }
              out.push(String(node.val));
              dfs(node.left);
              dfs(node.right);
            }
            dfs(root);
            return out.join(",");
          }

          function deserialize(data) {
            const tokens = data.split(",");
            let i = 0;
            function dfs() {
              const token = tokens[i++];
              if (token === "null") return null;
              return {
                val: Number(token),
                left: dfs(),
                right: dfs(),
              };
            }
            return dfs();
          }

          function demoRoundTrip() {
            const root = {
              val: 1,
              left: { val: 2, left: null, right: null },
