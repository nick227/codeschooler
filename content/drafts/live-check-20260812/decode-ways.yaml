id: js-interview-decode-ways
revision: 1
title: Decode Ways
summary: >-
  Count ways to decode a digit string where 1-26 map to A-Z, using DP with careful
  zero handling for single and two-digit groups.
difficulty: medium
pattern: dynamic-programming
challenge:
  id: js-interview-decode-ways-001
  revision: 1
  language: javascript
  title: Decode Ways
  level: 11
  difficultyScore: 60
  instruction: |
    A message containing letters A-Z is encoded by mapping A=1 ... Z=26.
    Given a string s of digits, return how many ways it can be decoded.

    Leading zeros are invalid: "0" and "06" decode in 0 ways. "10" and "27" are
    valid as one two-digit group when 10-26.

    Recurrence (dp[i] = ways to decode s.slice(0, i)):
    - If s[i-1] is '1'..'9', add dp[i-1] (take one digit)
    - If s[i-2..i-1] forms 10..26, add dp[i-2] (take two digits)

    Base: dp[0] = 1 (one way to decode empty prefix). If s[0] === '0', answer is 0.

    Examples: "12" -> 2 ("AB","L"); "226" -> 3; "06" -> 0.

    Complete `numDecodings(s)`.
  starterCode: |
    function numDecodings(s) {
      // DP over prefixes; watch zeros and 10-26 pairs
    }
  skills: [javascript.algorithms_dp, javascript.strings, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: numDecodings}
    - {type: functionReturns, name: numDecodings, args: ["12"], value: 2}
    - {type: functionReturns, name: numDecodings, args: ["226"], value: 3}
    - {type: functionReturns, name: numDecodings, args: ["06"], value: 0}
    - {type: functionReturns, name: numDecodings, args: ["27"], value: 1}
    - {type: functionReturns, name: numDecodings, args: ["10"], value: 1}
  hints:
    - level: 1
      message: >-
        If s is empty or starts with "0", return 0. Use an array (or two rolling vars) of size n+1.
    - level: 2
      message: >-
        dp[0]=1, dp[1]=1 when s[0] !== "0". For i from 2..n, optionally add one-digit and two-digit contributions.
    - level: 3
      message: >-
        One-digit OK when s[i-1] !== "0". Two-digit OK when Number(s.slice(i-2, i)) is between 10 and 26.
    - level: 4
      message: |
        function numDecodings(s) {
          if (!s.length || s[0] === "0") return 0;
          const dp = new Array(s.length + 1).fill(0);
          dp[0] = 1;
          dp[1] = 1;
          for (let i = 2; i <= s.length; i++) {
            if (s[i - 1] !== "0") dp[i] += dp[i - 1];
            const two = Number(s.slice(i - 2, i));
            if (two >= 10 && two <= 26) dp[i] += dp[i - 2];
          }
          return dp[s.length];
        }
  reward: {xp: 55}
  requiresRun: false
  runtime: &workerRuntime
    environment: worker
    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function numDecodings(s) {
        if (!s.length || s[0] === "0") return 0;
        const dp = new Array(s.length + 1).fill(0);
        dp[0] = 1;
        dp[1] = 1;
        for (let i = 2; i <= s.length; i++) {
          if (s[i - 1] !== "0") dp[i] += dp[i - 1];
          const two = Number(s.slice(i - 2, i));
          if (two >= 10 && two <= 26) dp[i] += dp[i - 2];
        }
        return dp[s.length];
      }
    acceptedSolutions:
      - name: rolling two vars
        source: |
          function numDecodings(s) {
            if (!s.length || s[0] === "0") return 0;
            let prev2 = 1;
            let prev1 = 1;
            for (let i = 2; i <= s.length; i++) {
              let cur = 0;
              if (s[i - 1] !== "0") cur += prev1;
              const two = Number(s.slice(i - 2, i));
              if (two >= 10 && two <= 26) cur += prev2;
              prev2 = prev1;
              prev1 = cur;
            }
            return prev1;
          }
    rejectedSolutions:
      - name: always 1 if no zero
        source: |
          function numDecodings(s) {
            return s.includes("0") ? 0 : 1;
          }
