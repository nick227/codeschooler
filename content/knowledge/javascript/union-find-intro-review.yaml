id: union-find-intro-review
revision: 1
title: Union-Find Intro Review
description: >-
  Reinforce parent arrays, find roots, and using same-component checks for path
  existence.
mode: practice
purpose: knowledge
questions:
  - id: uf-intro-001
    revision: 1
    type: multiple-choice
    prompt: In Union-Find, find(x) returns...
    skills: [javascript.algorithms_union_find]
    options:
      - {id: root, label: The root representative of x's component}
      - {id: deg, label: The number of edges touching x}
      - {id: idx, label: Always x + 1}
    answer:
      correctOptionIds: [root]
      explanation: Connectivity questions compare roots, not raw node ids.

  - id: uf-intro-002
    revision: 1
    type: true-false
    prompt: After unioning every undirected edge, source can reach destination iff find(source) equals find(destination).
    skills: [javascript.algorithms_union_find, javascript.graphs]
    answer:
      value: true
      explanation: Same root means they ended in the same connected component.

  - id: uf-intro-003
    revision: 1
    type: multiple-choice
    prompt: union(a, b) typically...
    skills: [javascript.algorithms_union_find]
    options:
      - {id: link, label: Links the root of one node to the root of the other}
      - {id: swap, label: Swaps the two node values in the graph}
      - {id: del, label: Deletes both nodes from the parent array}
    answer:
      correctOptionIds: [link]
      explanation: Linking roots merges the two components.

  - id: uf-intro-004
    revision: 1
    type: true-false
    prompt: Checking only for a direct edge between source and destination is enough to decide path existence in a general undirected graph.
    skills: [javascript.graphs]
    answer:
      value: false
      explanation: Paths may be longer than one edge; components capture multi-hop connectivity.
