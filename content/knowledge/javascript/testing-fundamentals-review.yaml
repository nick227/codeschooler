id: testing-fundamentals-review
revision: 1
title: Testing Fundamentals Review
description: Check assertions, mocks, and injectable seams.
mode: practice
purpose: knowledge
questions:
  - id: test-assert-001
    revision: 1
    type: multiple-choice
    prompt: An assertion helper is mainly used to...
    skills: [javascript.assertions]
    options:
      - {id: compare, label: Compare expected vs actual results in a test}
      - {id: style, label: Style a webpage with CSS}
      - {id: sort, label: Sort arrays in place}
    answer:
      correctOptionIds: [compare]
      explanation: Assertions encode the expected behavior of the unit under test.

  - id: test-mock-002
    revision: 1
    type: true-false
    prompt: A mock function that records `.calls` helps verify how collaborators were invoked.
    skills: [javascript.mocks]
    answer:
      value: true
      explanation: Call recording lets tests assert interactions without a real dependency.

  - id: test-seam-003
    revision: 1
    type: multiple-choice
    prompt: Injecting a `clock` into a greeter is valuable because tests can...
    skills: [javascript.test_seams]
    options:
      - {id: control, label: Control time without depending on the real system clock}
      - {id: network, label: Open unrestricted network sockets}
      - {id: css, label: Compile CSS faster}
    answer:
      correctOptionIds: [control]
      explanation: Test seams replace nondeterministic infrastructure with fakes.
