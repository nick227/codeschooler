id: backtracking-intro-review
revision: 1
title: Backtracking Intro Review
description: >-
  Reinforce choose-explore-undo and why phone keypad combinations need every
  letter choice at each digit.
mode: practice
purpose: knowledge
questions:
  - id: bt-intro-001
    revision: 1
    type: multiple-choice
    prompt: The core backtracking loop for letter combinations is...
    skills: [javascript.algorithms_backtracking]
    options:
      - {id: ceu, label: Choose a letter, explore the next digit, then undo before the next choice}
      - {id: sort, label: Sort the digits once and return a single string}
      - {id: bfs, label: Expand a queue of digit indices without recursion or undo}
    answer:
      correctOptionIds: [ceu]
      explanation: Push/recurse/pop (or equivalent) visits every combination systematically.

  - id: bt-intro-002
    revision: 1
    type: true-false
    prompt: If digits is empty, letterCombinations should return [].
    skills: [javascript.algorithms_backtracking]
    answer:
      value: true
      explanation: There are no digits to map, so there are no combinations.

  - id: bt-intro-003
    revision: 1
    type: multiple-choice
    prompt: Returning only the first mapped letter of each digit is wrong because...
    skills: [javascript.algorithms_backtracking, javascript.algorithms_dfs]
    options:
      - {id: miss, label: It misses every other valid branching choice in the search tree}
      - {id: order, label: The keypad map must be ignored entirely}
      - {id: empty, label: Empty digits must somehow produce all English words}
    answer:
      correctOptionIds: [miss]
      explanation: Backtracking must try every letter at the current digit before finishing.

  - id: bt-intro-004
    revision: 1
    type: true-false
    prompt: You should record a completed combination only when the path covers every digit position.
    skills: [javascript.algorithms_dfs, javascript.algorithms_backtracking]
    answer:
      value: true
      explanation: Partial paths are intermediate states; results are full-length strings.
