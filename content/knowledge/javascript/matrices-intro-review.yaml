id: matrices-intro-review
revision: 1
title: Matrices Intro Review
description: >-
  Reinforce row/column indexing and building an n×m result when transposing an
  m×n matrix.
mode: practice
purpose: knowledge
questions:
  - id: mat-intro-001
    revision: 1
    type: multiple-choice
    prompt: For transpose, the value at matrix[r][c] moves to...
    skills: [javascript.arrays]
    options:
      - {id: swap, label: "result[c][r]"}
      - {id: same, label: "result[r][c] unchanged"}
      - {id: flip, label: "result[r][matrix[0].length - 1 - c]"}
    answer:
      correctOptionIds: [swap]
      explanation: Transposing swaps the two indices across the main diagonal.

  - id: mat-intro-002
    revision: 1
    type: true-false
    prompt: An m×n matrix transpose has shape n×m.
    skills: [javascript.arrays]
    answer:
      value: true
      explanation: Rows become columns, so dimensions swap.

  - id: mat-intro-003
    revision: 1
    type: multiple-choice
    prompt: Returning the input matrix object without copying is wrong for transpose when...
    skills: [javascript.arrays]
    options:
      - {id: rect, label: The matrix is rectangular, so in-place row reuse cannot produce the new shape}
      - {id: one, label: The matrix is 1×1}
      - {id: never, label: Never — the input is always already transposed}
    answer:
      correctOptionIds: [rect]
      explanation: A 2×3 input must become 3×2; you need a newly allocated result.

  - id: mat-intro-004
    revision: 1
    type: true-false
    prompt: matrix[r][c] means row r, then column c inside that row array.
    skills: [javascript.arrays]
    answer:
      value: true
      explanation: Nested arrays are row-major; outer index is the row.
