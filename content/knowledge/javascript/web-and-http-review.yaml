id: web-and-http-review
revision: 1
title: Web & HTTP Review
description: Check HTTP methods, status classes, queries, and routing basics.
mode: practice
purpose: knowledge
questions:
  - id: http-method-001
    revision: 1
    type: multiple-choice
    prompt: Which verb is typically a safe read?
    skills: [javascript.http_methods]
    options:
      - {id: get, label: GET}
      - {id: post, label: POST}
      - {id: delete, label: DELETE}
    answer:
      correctOptionIds: [get]
      explanation: GET retrieves a resource without intending to change server state.

  - id: http-status-002
    revision: 1
    type: multiple-choice
    prompt: A 404 response is best classified as...
    skills: [javascript.http_status]
    options:
      - {id: client, label: A client error (4xx)}
      - {id: success, label: A success (2xx)}
      - {id: server, label: A server error (5xx)}
    answer:
      correctOptionIds: [client]
      explanation: 4xx means the request was invalid or the resource was not found for that client.

  - id: http-route-003
    revision: 1
    type: true-false
    prompt: REST route matching usually considers both HTTP method and path.
    skills: [javascript.rest_routing]
    answer:
      value: true
      explanation: The same path can expose different handlers for GET vs POST.
