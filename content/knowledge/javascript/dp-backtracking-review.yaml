id: dp-backtracking-review
revision: 1
title: DP & Backtracking Review
description: Check dynamic programming recurrences and backtracking search rules.
mode: practice
purpose: knowledge
questions:
  - id: dp-rob-001
    revision: 1
    type: multiple-choice
    prompt: House Robber's core recurrence chooses between...
    skills: [javascript.algorithms_dp]
    options:
      - {id: skip, label: Skipping the current house or robbing it with the best from two back}
      - {id: all, label: Always summing every house}
      - {id: sort, label: Sorting houses before a binary search}
    answer:
      correctOptionIds: [skip]
      explanation: Adjacent constraint forces a skip-or-take decision at each index.

  - id: dp-paths-002
    revision: 1
    type: true-false
    prompt: In Unique Paths, each cell's ways equal the sum of ways from the cell above and the cell to the left.
    skills: [javascript.algorithms_dp]
    answer:
      value: true
      explanation: Only those two moves can enter a cell.

  - id: bt-combo-003
    revision: 1
    type: multiple-choice
    prompt: Combination Sum avoids duplicate permutations by...
    skills: [javascript.algorithms_backtracking]
    options:
      - {id: start, label: Passing a start index and only choosing candidates at or after it}
      - {id: random, label: Shuffling candidates before each recursive call}
      - {id: heap, label: Inserting every path into a max-heap}
    answer:
      correctOptionIds: [start]
      explanation: Nondecreasing candidate order collapses permutation duplicates.

  - id: bt-parens-004
    revision: 1
    type: multiple-choice
    prompt: When generating parentheses, you may add a closing ")" only when...
    skills: [javascript.algorithms_backtracking]
    options:
      - {id: closes, label: The count of closes is still less than the count of opens}
      - {id: always, label: You have placed zero opens so far}
      - {id: n2, label: The string length is already 2n}
    answer:
      correctOptionIds: [closes]
      explanation: More closes than opens would make the prefix invalid.
