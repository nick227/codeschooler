      - id: js-dom-toggle-text-115
        revision: 1
        language: javascript
        title: Toggle Text On Click
        instruction: >-
          Create `#label` starting as `off` and a button. On each click, set the
          label to `on` if it was `off`, otherwise `off`. Click the button once,
          then `console.log` the label text.
        starterCode: |
          // Wire toggle button, click once, log label
        skills: [javascript.dom_selection, javascript.dom_events, javascript.conditionals]
        level: 7
        difficultyScore: 40
        tags: [dom, events, toggle]
        guidance: supported
        checks:
          - {type: outputEquals, value: "on"}
        hints:
          - level: 1
            message: Start label text at off.
          - level: 2
            message: In the click handler, flip between off and on.
          - level: 3
            message: Call button.click() once before logging.
          - level: 4
            message: |
              const root = document.getElementById("preview-root");
              const label = document.createElement("p");
              const button = document.createElement("button");
              label.id = "label";
              label.textContent = "off";
              button.addEventListener("click", function () {
                label.textContent = label.textContent === "off" ? "on" : "off";
              });
              root.appendChild(label);
              root.appendChild(button);
              button.click();
              console.log(label.textContent);
        reward: {xp: 40}
        requiresRun: true
        runtime: *domRuntime
        authoring:
          referenceSolution: |
            const root = document.getElementById("preview-root");
            const label = document.createElement("p");
            const button = document.createElement("button");
            label.id = "label";
            label.textContent = "off";
            button.addEventListener("click", function () {
              label.textContent = label.textContent === "off" ? "on" : "off";
            });
            root.appendChild(label);
            root.appendChild(button);
            button.click();
            console.log(label.textContent);
          acceptedSolutions:
            - name: boolean flag
              source: |
                const root = document.getElementById("preview-root");
                const label = document.createElement("p");
                const button = document.createElement("button");
                label.id = "label";
                let on = false;
                label.textContent = "off";
                button.addEventListener("click", function () {
                  on = !on;
                  label.textContent = on ? "on" : "off";
                });
                root.appendChild(label);
                root.appendChild(button);
                button.click();
                console.log(label.textContent);
          rejectedSolutions:
            - name: never clicks
              source: |
                const root = document.getElementById("preview-root");
                const label = document.createElement("p");
                const button = document.createElement("button");
                label.id = "label";
                label.textContent = "off";
                button.addEventListener("click", function () {
                  label.textContent = "on";
                });
                root.appendChild(label);
                root.appendChild(button);
                console.log(label.textContent);
