id: async-and-apis
revision: 1
title: Async & APIs
description: >-
  Move from callbacks to Promises and async/await, then shape JSON API payloads
  safely.

lessons:
  - id: callbacks
    revision: 1
    title: Callbacks
    summary: Pass a function into another function to customize behavior.
    challenges:
      - id: js-callback-apply-047
        revision: 1
        language: javascript
        title: Apply a Callback
        instruction: >-
          Complete `applyCallback(value, fn)` so it returns `fn(value)`.
        starterCode: |
          function applyCallback(value, fn) {
            // Call fn with value and return the result
          }

          function demo() {
            return applyCallback(3, function (n) { return n * 2; });
          }
        skills: [javascript.functions]
        level: 8
        difficultyScore: 25
        tags: [callbacks]
        guidance: guided
        checks:
          - {type: functionExists, name: applyCallback}
          - {type: functionExists, name: demo}
          - {type: functionReturns, name: demo, args: [], value: 6}
        hints:
          - level: 1
            message: fn is a function you can call.
          - level: 2
            message: Pass value as the argument to fn.
          - level: 3
            message: "return fn(value);"
          - level: 4
            message: |
              function applyCallback(value, fn) {
                return fn(value);
              }

              function demo() {
                return applyCallback(3, function (n) { return n * 2; });
              }
        reward: {xp: 25}
        requiresRun: false
        runtime: &workerRuntime
          environment: worker
          timeoutMs: 2000
          maxOutputBytes: 16384
          capabilities: {network: false, storage: false, timers: false, dom: false}
        authoring:
          referenceSolution: |
            function applyCallback(value, fn) {
              return fn(value);
            }

            function demo() {
              return applyCallback(3, function (n) { return n * 2; });
            }
          acceptedSolutions:
            - name: intermediate
              source: |
                function applyCallback(value, fn) {
                  const result = fn(value);
                  return result;
                }

                function demo() {
                  return applyCallback(3, function (n) { return n * 2; });
                }
          rejectedSolutions:
            - name: ignores callback
              source: |
                function applyCallback(value, fn) {
                  return value;
                }

                function demo() {
                  return applyCallback(3, function (n) { return n * 2; });
                }

  - id: promises
    revision: 1
    title: Promises
    summary: Return a Promise that resolves to a value.
    challenges:
      - id: js-promise-resolve-048
        revision: 1
        language: javascript
        title: Resolve a Value
        instruction: >-
          Complete `getGreeting()` so it returns a Promise that resolves to
          `"hello"`. Keep `demo()` as written.
        starterCode: |
          function getGreeting() {
            // Return a Promise that resolves to "hello"
          }

          async function demo() {
            return await getGreeting();
          }
        skills: [javascript.promises, javascript.async_await, javascript.functions]
        level: 8
        difficultyScore: 35
        tags: [promises, async]
        guidance: guided
        checks:
          - {type: functionExists, name: getGreeting}
          - {type: functionExists, name: demo}
          - {type: functionReturns, name: demo, args: [], value: "hello"}
        hints:
          - level: 1
            message: Promise.resolve(value) creates an already-resolved Promise.
          - level: 2
            message: 'return Promise.resolve("hello");'
          - level: 3
            message: demo awaits getGreeting, so return a Promise from getGreeting.
          - level: 4
            message: |
              function getGreeting() {
                return Promise.resolve("hello");
              }

              async function demo() {
                return await getGreeting();
              }
        reward: {xp: 35}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function getGreeting() {
              return Promise.resolve("hello");
            }

            async function demo() {
              return await getGreeting();
            }
          acceptedSolutions:
            - name: async function
              source: |
                async function getGreeting() {
                  return "hello";
                }

                async function demo() {
                  return await getGreeting();
                }
          rejectedSolutions:
            - name: wrong greeting
              source: |
                function getGreeting() {
                  return Promise.resolve("goodbye");
                }

                async function demo() {
                  return await getGreeting();
                }

  - id: async-await
    revision: 1
    title: Async Await
    summary: Pause until a Promise settles, then continue.
    challenges:
      - id: js-async-double-049
        revision: 1
        language: javascript
        title: Await Then Double
        instruction: >-
          `loadNumber()` already returns a Promise of a number. Complete
          `doubleLoaded()` as an `async` function that awaits `loadNumber()`
          and returns twice that value.
        starterCode: |
          function loadNumber() {
            return Promise.resolve(21);
          }

          async function doubleLoaded() {
            // Await loadNumber, then return double
          }
        skills: [javascript.async_await, javascript.promises, javascript.functions, javascript.arithmetic]
        level: 8
        difficultyScore: 40
        tags: [async, promises]
        guidance: guided
        checks:
          - {type: functionExists, name: doubleLoaded}
          - {type: functionReturns, name: doubleLoaded, args: [], value: 42}
        hints:
          - level: 1
            message: Use await inside an async function.
          - level: 2
            message: "const n = await loadNumber();"
          - level: 3
            message: return n * 2;
          - level: 4
            message: |
              function loadNumber() {
                return Promise.resolve(21);
              }

              async function doubleLoaded() {
                const n = await loadNumber();
                return n * 2;
              }
        reward: {xp: 40}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function loadNumber() {
              return Promise.resolve(21);
            }

            async function doubleLoaded() {
              const n = await loadNumber();
              return n * 2;
            }
          acceptedSolutions:
            - name: inline
              source: |
                function loadNumber() {
                  return Promise.resolve(21);
                }

                async function doubleLoaded() {
                  return (await loadNumber()) * 2;
                }
          rejectedSolutions:
            - name: forgot await
              source: |
                function loadNumber() {
                  return Promise.resolve(21);
                }

                async function doubleLoaded() {
                  const n = loadNumber();
                  return n * 2;
                }

  - id: api-json
    revision: 1
    title: API JSON Shaping
    summary: Pull fields out of a JSON API payload.
    challenges:
      - id: js-parse-api-json-050
        revision: 1
        language: javascript
        title: Read the User Name
        instruction: >-
          Complete `userNameFromPayload(jsonText)` so it parses the JSON string
          and returns `payload.user.name`. If parsing fails, return `null`.
        starterCode: |
          function userNameFromPayload(jsonText) {
            // Parse JSON and return payload.user.name
          }
        skills: [javascript.fetch_api, javascript.error_handling, javascript.objects, javascript.functions]
        level: 8
        difficultyScore: 40
        tags: [api, json, fetch]
        guidance: supported
        checks:
          - {type: functionExists, name: userNameFromPayload}
          - {type: functionReturns, name: userNameFromPayload, args: ['{"user":{"name":"Ada"}}'], value: "Ada"}
          - {type: functionReturns, name: userNameFromPayload, args: ["nope"], value: null}
        hints:
          - level: 1
            message: Use JSON.parse inside try / catch.
          - level: 2
            message: After parsing, read payload.user.name.
          - level: 3
            message: Return null when parsing throws.
          - level: 4
            message: |
              function userNameFromPayload(jsonText) {
                try {
                  const payload = JSON.parse(jsonText);
                  return payload.user.name;
                } catch (error) {
                  return null;
                }
              }
        reward: {xp: 40}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function userNameFromPayload(jsonText) {
              try {
                const payload = JSON.parse(jsonText);
                return payload.user.name;
              } catch (error) {
                return null;
              }
            }
          acceptedSolutions:
            - name: optional path guard
              source: |
                function userNameFromPayload(jsonText) {
                  try {
                    const payload = JSON.parse(jsonText);
                    return payload && payload.user ? payload.user.name : null;
                  } catch {
                    return null;
                  }
                }
          rejectedSolutions:
            - name: no try catch
              source: |
                function userNameFromPayload(jsonText) {
                  const payload = JSON.parse(jsonText);
                  return payload.user.name;
                }

  - id: more-async
    revision: 1
    title: More Async Practice
    summary: Chain thenables, await failures safely, and wait on Promise.all.
    challenges:
      - id: js-promise-then-add-116
        revision: 1
        language: javascript
        title: Then Add One
        instruction: >-
          Complete `thenAddOne(promise)` so it returns a Promise that resolves
          to the fulfilled value plus 1. Keep `demoThen()` as written.
        starterCode: |
          function thenAddOne(promise) {
            // Return promise.then(...)
          }

          async function demoThen() {
            return thenAddOne(Promise.resolve(4));
          }
        skills: [javascript.promises, javascript.functions]
        level: 8
        difficultyScore: 30
        tags: [async, promises, then]
        guidance: guided
        checks:
          - {type: functionExists, name: thenAddOne}
          - {type: functionExists, name: demoThen}
          - {type: functionReturns, name: demoThen, args: [], value: 5}
        hints:
          - level: 1
            message: Use promise.then to transform the resolved value.
          - level: 2
            message: "return promise.then((value) => value + 1);"
          - level: 3
            message: demoThen awaits that returned promise via functionReturns.
          - level: 4
            message: |
              function thenAddOne(promise) {
                return promise.then((value) => value + 1);
              }

              async function demoThen() {
                return thenAddOne(Promise.resolve(4));
              }
        reward: {xp: 30}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function thenAddOne(promise) {
              return promise.then((value) => value + 1);
            }

            async function demoThen() {
              return thenAddOne(Promise.resolve(4));
            }
          acceptedSolutions:
            - name: async await wrapper
              source: |
                async function thenAddOne(promise) {
                  const value = await promise;
                  return value + 1;
                }

                async function demoThen() {
                  return thenAddOne(Promise.resolve(4));
                }
          rejectedSolutions:
            - name: returns raw promise value shape wrong
              source: |
                function thenAddOne(promise) {
                  return promise;
                }

                async function demoThen() {
                  return thenAddOne(Promise.resolve(4));
                }

      - id: js-async-safe-117
        revision: 1
        language: javascript
        title: Await With Fallback
        instruction: >-
          Complete async `safeAwait(promise, fallback)` so it returns the
          resolved value, or `fallback` when the promise rejects. Keep
          `demoSafeAwait()` as written.
        starterCode: |
          async function safeAwait(promise, fallback) {
            // try await; catch -> fallback
          }

          async function demoSafeAwait() {
            return [
              await safeAwait(Promise.resolve("ok"), "nope"),
              await safeAwait(Promise.reject(new Error("x")), "nope"),
            ];
          }
        skills: [javascript.async_await, javascript.promises, javascript.error_handling]
        level: 8
        difficultyScore: 40
        tags: [async, await, try-catch]
        guidance: supported
        checks:
          - {type: functionExists, name: safeAwait}
          - {type: functionExists, name: demoSafeAwait}
          - {type: functionReturns, name: demoSafeAwait, args: [], value: ["ok", "nope"]}
        hints:
          - level: 1
            message: Wrap await promise in try/catch.
          - level: 2
            message: Return the awaited value on success.
          - level: 3
            message: Return fallback in the catch block.
          - level: 4
            message: |
              async function safeAwait(promise, fallback) {
                try {
                  return await promise;
                } catch (error) {
                  return fallback;
                }
              }

              async function demoSafeAwait() {
                return [
                  await safeAwait(Promise.resolve("ok"), "nope"),
                  await safeAwait(Promise.reject(new Error("x")), "nope"),
                ];
              }
        reward: {xp: 40}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            async function safeAwait(promise, fallback) {
              try {
                return await promise;
              } catch (error) {
                return fallback;
              }
            }

            async function demoSafeAwait() {
              return [
                await safeAwait(Promise.resolve("ok"), "nope"),
                await safeAwait(Promise.reject(new Error("x")), "nope"),
              ];
            }
          acceptedSolutions:
            - name: then catch
              source: |
                async function safeAwait(promise, fallback) {
                  return promise.then(
                    (value) => value,
                    () => fallback,
                  );
                }

                async function demoSafeAwait() {
                  return [
                    await safeAwait(Promise.resolve("ok"), "nope"),
                    await safeAwait(Promise.reject(new Error("x")), "nope"),
                  ];
                }
          rejectedSolutions:
            - name: no catch
              source: |
                async function safeAwait(promise, fallback) {
                  return await promise;
                }

                async function demoSafeAwait() {
                  return [
                    await safeAwait(Promise.resolve("ok"), "nope"),
                    await safeAwait(Promise.reject(new Error("x")), "nope"),
                  ];
                }

      - id: js-promise-all-labels-118
        revision: 1
        language: javascript
        title: Await Both Labels
        instruction: >-
          Complete async `bothLabels(left, right)` so it awaits both promises
          with `Promise.all` and returns `[leftValue, rightValue]`. Keep
          `demoBoth()` as written.
        starterCode: |
          async function bothLabels(left, right) {
            // Use Promise.all
          }

          async function demoBoth() {
            return bothLabels(Promise.resolve("A"), Promise.resolve("B"));
          }
        skills: [javascript.async_composition, javascript.promises, javascript.async_await]
        level: 8
        difficultyScore: 35
        tags: [async, promises]
        guidance: guided
        checks:
          - {type: functionExists, name: bothLabels}
          - {type: functionExists, name: demoBoth}
          - {type: functionReturns, name: demoBoth, args: [], value: ["A", "B"]}
        hints:
          - level: 1
            message: Pass both promises into Promise.all.
          - level: 2
            message: Await the combined promise.
          - level: 3
            message: Return the resulting array.
          - level: 4
            message: |
              async function bothLabels(left, right) {
                return Promise.all([left, right]);
              }

              async function demoBoth() {
                return bothLabels(Promise.resolve("A"), Promise.resolve("B"));
              }
        reward: {xp: 35}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            async function bothLabels(left, right) {
              return Promise.all([left, right]);
            }

            async function demoBoth() {
              return bothLabels(Promise.resolve("A"), Promise.resolve("B"));
            }
          acceptedSolutions:
            - name: sequential await
              source: |
                async function bothLabels(left, right) {
                  const a = await left;
                  const b = await right;
                  return [a, b];
                }

                async function demoBoth() {
                  return bothLabels(Promise.resolve("A"), Promise.resolve("B"));
                }
          rejectedSolutions:
            - name: swaps order
              source: |
                async function bothLabels(left, right) {
                  const [a, b] = await Promise.all([left, right]);
                  return [b, a];
                }

                async function demoBoth() {
                  return bothLabels(Promise.resolve("A"), Promise.resolve("B"));
                }
