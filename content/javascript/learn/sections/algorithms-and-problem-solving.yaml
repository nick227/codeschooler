id: algorithms-and-problem-solving
revision: 1
title: Algorithms & Problem Solving
description: >-
  Practice linear search, binary search, sliding windows, and simple recursion.

lessons:
  - id: linear-search
    revision: 1
    title: Linear Search
    summary: Scan from left to right until a match is found.
    challenges:
      - id: js-linear-search-055
        revision: 1
        language: javascript
        title: Linear Search
        instruction: >-
          Complete `linearSearch(values, target)` so it returns the index of the
          first matching value, or `-1` when absent.
        starterCode: |
          function linearSearch(values, target) {
            // Scan left to right
          }
        skills: [javascript.arrays, javascript.loops, javascript.functions]
        level: 10
        difficultyScore: 30
        tags: [algorithms, search]
        guidance: guided
        checks:
          - {type: functionExists, name: linearSearch}
          - {type: functionReturns, name: linearSearch, args: [[4, 8, 15], 8], value: 1}
          - {type: functionReturns, name: linearSearch, args: [[1, 2], 9], value: -1}
        hints:
          - level: 1
            message: Compare each value to target while tracking its index.
          - level: 2
            message: Return immediately on the first match.
          - level: 3
            message: Return -1 after the loop if nothing matched.
          - level: 4
            message: |
              function linearSearch(values, target) {
                for (let i = 0; i < values.length; i++) {
                  if (values[i] === target) return i;
                }
                return -1;
              }
        reward: {xp: 30}
        requiresRun: false
        runtime: &workerRuntime
          environment: worker
          timeoutMs: 2000
          maxOutputBytes: 16384
          capabilities: {network: false, storage: false, timers: false, dom: false}
        authoring:
          referenceSolution: |
            function linearSearch(values, target) {
              for (let i = 0; i < values.length; i++) {
                if (values[i] === target) return i;
              }
              return -1;
            }
          acceptedSolutions:
            - name: indexOf
              source: |
                function linearSearch(values, target) {
                  return values.indexOf(target);
                }
          rejectedSolutions:
            - name: boolean includes
              source: |
                function linearSearch(values, target) {
                  return values.includes(target);
                }

  - id: binary-search
    revision: 1
    title: Binary Search
    summary: Cut a sorted search space in half each step.
    challenges:
      - id: js-binary-search-056
        revision: 1
        language: javascript
        title: Binary Search
        instruction: >-
          Complete `binarySearch(sorted, target)` for a sorted ascending array.
          Return the index of `target`, or `-1` if it is missing.
        starterCode: |
          function binarySearch(sorted, target) {
            // Use left/right mid comparisons
          }
        skills: [javascript.algorithms_binary_search, javascript.arrays, javascript.functions]
        level: 10
        difficultyScore: 50
        tags: [algorithms, binary-search]
        guidance: supported
        checks:
          - {type: functionExists, name: binarySearch}
          - {type: functionReturns, name: binarySearch, args: [[1, 3, 5, 7, 9], 7], value: 3}
          - {type: functionReturns, name: binarySearch, args: [[1, 3, 5, 7, 9], 2], value: -1}
          - {type: functionReturns, name: binarySearch, args: [[2], 2], value: 0}
        hints:
          - level: 1
            message: Keep left and right indexes and compute mid each step.
          - level: 2
            message: If sorted[mid] is too small, move left to mid + 1.
          - level: 3
            message: If sorted[mid] is too large, move right to mid - 1.
          - level: 4
            message: |
              function binarySearch(sorted, target) {
                let left = 0;
                let right = sorted.length - 1;
                while (left <= right) {
                  const mid = Math.floor((left + right) / 2);
                  if (sorted[mid] === target) return mid;
                  if (sorted[mid] < target) left = mid + 1;
                  else right = mid - 1;
                }
                return -1;
              }
        reward: {xp: 50}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function binarySearch(sorted, target) {
              let left = 0;
              let right = sorted.length - 1;
              while (left <= right) {
                const mid = Math.floor((left + right) / 2);
                if (sorted[mid] === target) return mid;
                if (sorted[mid] < target) left = mid + 1;
                else right = mid - 1;
              }
              return -1;
            }
          acceptedSolutions:
            - name: linear fallback still correct
              source: |
                function binarySearch(sorted, target) {
                  return sorted.indexOf(target);
                }
          rejectedSolutions:
            - name: always missing
              source: |
                function binarySearch(sorted, target) {
                  return -1;
                }

  - id: sliding-window
    revision: 1
    title: Sliding Window
    summary: Maintain a running window sum in linear time.
    challenges:
      - id: js-sliding-window-sum-057
        revision: 1
        language: javascript
        title: Max Subarray Sum of Size K
        instruction: >-
          Complete `maxSubarraySum(arr, k)` so it returns the maximum sum of any
          contiguous subarray of length `k`. Use a sliding window in O(N) time.
          Assume `arr.length >= k` and `k >= 1`.
        starterCode: |
          function maxSubarraySum(arr, k) {
            // Maintain a running window sum
          }
        skills: [javascript.algorithms_sliding_window, javascript.arrays, javascript.functions]
        level: 10
        difficultyScore: 55
        tags: [algorithms, sliding-window]
        guidance: supported
        checks:
          - {type: functionExists, name: maxSubarraySum}
          - {type: functionReturns, name: maxSubarraySum, args: [[2, 1, 5, 1, 3, 2], 3], value: 9}
          - {type: functionReturns, name: maxSubarraySum, args: [[1, 2, 3], 1], value: 3}
          - {type: functionReturns, name: maxSubarraySum, args: [[4, 4, 4], 3], value: 12}
        hints:
          - level: 1
            message: Sum the first k values, then slide by removing the left and adding the right.
          - level: 2
            message: Track the best sum seen while the window moves.
          - level: 3
            message: "windowSum += arr[i] - arr[i - k];"
          - level: 4
            message: |
              function maxSubarraySum(arr, k) {
                let windowSum = 0;
                for (let i = 0; i < k; i++) windowSum += arr[i];
                let best = windowSum;
                for (let i = k; i < arr.length; i++) {
                  windowSum += arr[i] - arr[i - k];
                  if (windowSum > best) best = windowSum;
                }
                return best;
              }
        reward: {xp: 55}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function maxSubarraySum(arr, k) {
              let windowSum = 0;
              for (let i = 0; i < k; i++) windowSum += arr[i];
              let best = windowSum;
              for (let i = k; i < arr.length; i++) {
                windowSum += arr[i] - arr[i - k];
                if (windowSum > best) best = windowSum;
              }
              return best;
            }
          acceptedSolutions:
            - name: nested brute force
              source: |
                function maxSubarraySum(arr, k) {
                  let best = -Infinity;
                  for (let i = 0; i <= arr.length - k; i++) {
                    let sum = 0;
                    for (let j = i; j < i + k; j++) sum += arr[j];
                    if (sum > best) best = sum;
                  }
                  return best;
                }
          rejectedSolutions:
            - name: sums whole array
              source: |
                function maxSubarraySum(arr, k) {
                  let sum = 0;
                  for (const n of arr) sum += n;
                  return sum;
                }

  - id: recursion-basics
    revision: 1
    title: Recursion Basics
    summary: Solve a problem by calling the same function on a smaller input.
    challenges:
      - id: js-recursion-sum-058
        revision: 1
        language: javascript
        title: Recursive Sum
        instruction: >-
          Complete `sumTo(n)` so it returns `1 + 2 + ... + n` using recursion.
          `sumTo(1)` returns `1`. Assume `n >= 1`.
        starterCode: |
          function sumTo(n) {
            // Base case + recursive case
          }
        skills: [javascript.algorithms_recursion, javascript.functions, javascript.conditionals]
        level: 10
        difficultyScore: 45
        tags: [algorithms, recursion]
        guidance: supported
        checks:
          - {type: functionExists, name: sumTo}
          - {type: functionReturns, name: sumTo, args: [1], value: 1}
          - {type: functionReturns, name: sumTo, args: [4], value: 10}
          - {type: functionReturns, name: sumTo, args: [5], value: 15}
        hints:
          - level: 1
            message: Stop when n is 1.
          - level: 2
            message: Otherwise return n plus sumTo(n - 1).
          - level: 3
            message: "if (n === 1) return 1;"
          - level: 4
            message: |
              function sumTo(n) {
                if (n === 1) return 1;
                return n + sumTo(n - 1);
              }
        reward: {xp: 45}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function sumTo(n) {
              if (n === 1) return 1;
              return n + sumTo(n - 1);
            }
          acceptedSolutions:
            - name: loop formula
              source: |
                function sumTo(n) {
                  return (n * (n + 1)) / 2;
                }
          rejectedSolutions:
            - name: off by one
              source: |
                function sumTo(n) {
                  if (n === 1) return 1;
                  return n + sumTo(n - 1) - 1;
                }

  - id: more-algorithms
    revision: 1
    title: More Algorithm Patterns
    summary: Practice two pointers, hash frequency, recursion, and a greedy scan.
    challenges:
      - id: js-two-pointers-palindrome-123
        revision: 1
        language: javascript
        title: Array Palindrome
        instruction: >-
          Complete `isPalindrome(values)` so it returns `true` when the array
          reads the same forward and backward. Prefer two pointers from both ends.
        starterCode: |
          function isPalindrome(values) {
            // Compare inward from both ends
          }
        skills: [javascript.algorithms_two_pointers, javascript.arrays, javascript.functions]
        level: 10
        difficultyScore: 35
        tags: [two-pointers, arrays]
        guidance: guided
        checks:
          - {type: functionExists, name: isPalindrome}
          - {type: functionReturns, name: isPalindrome, args: [[1, 2, 2, 1]], value: true}
          - {type: functionReturns, name: isPalindrome, args: [[1, 2, 3, 1]], value: false}
          - {type: functionReturns, name: isPalindrome, args: [[1, 2, 3]], value: false}
          - {type: functionReturns, name: isPalindrome, args: [[]], value: true}
        hints:
          - level: 1
            message: Start left at 0 and right at the last index.
          - level: 2
            message: If values[left] !== values[right], return false.
          - level: 3
            message: Move the pointers inward until they meet.
          - level: 4
            message: |
              function isPalindrome(values) {
                let left = 0;
                let right = values.length - 1;
                while (left < right) {
                  if (values[left] !== values[right]) return false;
                  left += 1;
                  right -= 1;
                }
                return true;
              }
        reward: {xp: 35}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function isPalindrome(values) {
              let left = 0;
              let right = values.length - 1;
              while (left < right) {
                if (values[left] !== values[right]) return false;
                left += 1;
                right -= 1;
              }
              return true;
            }
          acceptedSolutions:
            - name: reverse compare
              source: |
                function isPalindrome(values) {
                  return values.join(",") === values.slice().reverse().join(",");
                }
          rejectedSolutions:
            - name: only checks first last
              source: |
                function isPalindrome(values) {
                  if (!values.length) return true;
                  return values[0] === values[values.length - 1];
                }

      - id: js-freq-most-common-124
        revision: 1
        language: javascript
        title: Most Common Value
        instruction: >-
          Complete `mostCommon(values)` so it returns the value that appears most
          often. If there is a tie, return the one that appears first in `values`.
          Use a Map for counts.
        starterCode: |
          function mostCommon(values) {
            // Count with a Map, then pick the winner
          }
        skills: [javascript.algorithms_hash_maps, javascript.maps, javascript.arrays, javascript.functions]
        level: 10
        difficultyScore: 45
        tags: [hash-map, frequency]
        guidance: supported
        checks:
          - {type: functionExists, name: mostCommon}
          - {type: functionReturns, name: mostCommon, args: [["a", "b", "a", "c", "b", "a"]], value: "a"}
          - {type: functionReturns, name: mostCommon, args: [[1, 2, 2, 1, 1]], value: 1}
          - {type: functionReturns, name: mostCommon, args: [["a", "a", "b"]], value: "a"}
          - {type: functionReturns, name: mostCommon, args: [["x"]], value: "x"}
        hints:
          - level: 1
            message: Increment a Map count for each value.
          - level: 2
            message: Track the best value and best count while counting or in a second pass.
          - level: 3
            message: On ties, keep the earlier winner (do not replace on equal counts).
          - level: 4
            message: |
              function mostCommon(values) {
                const counts = new Map();
                let best = values[0];
                let bestCount = 0;
                for (const value of values) {
                  const next = (counts.get(value) || 0) + 1;
                  counts.set(value, next);
                  if (next > bestCount) {
                    best = value;
                    bestCount = next;
                  }
                }
                return best;
              }
        reward: {xp: 45}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function mostCommon(values) {
              const counts = new Map();
              let best = values[0];
              let bestCount = 0;
              for (const value of values) {
                const next = (counts.get(value) || 0) + 1;
                counts.set(value, next);
                if (next > bestCount) {
                  best = value;
                  bestCount = next;
                }
              }
              return best;
            }
          acceptedSolutions:
            - name: object counts
              source: |
                function mostCommon(values) {
                  const counts = {};
                  let best = values[0];
                  let bestCount = 0;
                  for (const value of values) {
                    counts[value] = (counts[value] || 0) + 1;
                    if (counts[value] > bestCount) {
                      best = value;
                      bestCount = counts[value];
                    }
                  }
                  return best;
                }
          rejectedSolutions:
            - name: returns last value
              source: |
                function mostCommon(values) {
                  return values[values.length - 1];
                }

      - id: js-recursion-factorial-125
        revision: 1
        language: javascript
        title: Recursive Factorial
        instruction: >-
          Complete `factorial(n)` so it returns `n!` for `n >= 0` using recursion.
          Use `factorial(0) === 1`.
        starterCode: |
          function factorial(n) {
            // Recursive factorial
          }
        skills: [javascript.algorithms_recursion, javascript.functions, javascript.arithmetic]
        level: 10
        difficultyScore: 35
        tags: [recursion]
        guidance: guided
        checks:
          - {type: functionExists, name: factorial}
          - {type: functionReturns, name: factorial, args: [0], value: 1}
          - {type: functionReturns, name: factorial, args: [1], value: 1}
          - {type: functionReturns, name: factorial, args: [5], value: 120}
        hints:
          - level: 1
            message: Base case is n === 0 (or n <= 1) returning 1.
          - level: 2
            message: Otherwise return n * factorial(n - 1).
          - level: 3
            message: Make sure the base case stops the recursion.
          - level: 4
            message: |
              function factorial(n) {
                if (n <= 1) return 1;
                return n * factorial(n - 1);
              }
        reward: {xp: 35}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function factorial(n) {
              if (n <= 1) return 1;
              return n * factorial(n - 1);
            }
          acceptedSolutions:
            - name: loop
              source: |
                function factorial(n) {
                  let product = 1;
                  for (let i = 2; i <= n; i++) product *= i;
                  return product;
                }
          rejectedSolutions:
            - name: returns n
              source: |
                function factorial(n) {
                  return n;
                }

      - id: js-greedy-max-reach-126
        revision: 1
        language: javascript
        title: Farthest Reach
        instruction: >-
          Complete `farthestReach(nums)` so it returns the farthest index you can
          reach from index 0 when from i you may jump up to `nums[i]` steps.
          You do not have to decide if the end is reachable — just the max index
          touched by a greedy scan (capped at the last index).
        starterCode: |
          function farthestReach(nums) {
            // Greedy farthest index
          }
        skills: [javascript.algorithms_greedy, javascript.arrays, javascript.functions]
        level: 10
        difficultyScore: 45
        tags: [greedy, arrays]
        guidance: supported
        checks:
          - {type: functionExists, name: farthestReach}
          - {type: functionReturns, name: farthestReach, args: [[2, 3, 1, 1, 4]], value: 4}
          - {type: functionReturns, name: farthestReach, args: [[1, 0, 2]], value: 1}
          - {type: functionReturns, name: farthestReach, args: [[0]], value: 0}
        hints:
          - level: 1
            message: Track farthest as you walk left to right.
          - level: 2
            message: Stop scanning past the current farthest reach.
          - level: 3
            message: "farthest = Math.max(farthest, i + nums[i])"
          - level: 4
            message: |
              function farthestReach(nums) {
                let farthest = 0;
                for (let i = 0; i < nums.length && i <= farthest; i++) {
                  farthest = Math.max(farthest, i + nums[i]);
                }
                return Math.min(farthest, nums.length - 1);
              }
        reward: {xp: 45}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function farthestReach(nums) {
              let farthest = 0;
              for (let i = 0; i < nums.length && i <= farthest; i++) {
                farthest = Math.max(farthest, i + nums[i]);
              }
              return Math.min(farthest, nums.length - 1);
            }
          acceptedSolutions:
            - name: uncapped then min
              source: |
                function farthestReach(nums) {
                  let farthest = 0;
                  for (let i = 0; i < nums.length; i++) {
                    if (i > farthest) break;
                    farthest = Math.max(farthest, i + nums[i]);
                  }
                  return Math.min(farthest, nums.length - 1);
                }
          rejectedSolutions:
            - name: returns length
              source: |
                function farthestReach(nums) {
                  return nums.length;
                }
