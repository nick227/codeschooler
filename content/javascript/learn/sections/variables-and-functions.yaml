id: variables-and-functions
revision: 1
title: Variables, Scope & Function Design
description: >-
  Master const vs let reassignment, function parameters, return mechanics, and clean guard clauses.

lessons:
  - id: variable-reassignment
    revision: 1
    title: Reassignment & Mutability
    summary: Choose between const and let when updating variable values over time.
    challenges:
      - id: js-const-vs-let-014
        revision: 1
        language: javascript
        title: Fix Constant Reassignment Bug
        instruction: >-
          The function `countUp(limit)` throws `TypeError: Assignment to constant variable`.
          Change the variable declaration so `counter` can be incremented inside the loop.
        starterCode: |
          function countUp(limit) {
            // FIX BUG: counter needs to be reassigned
            const counter = 0;
            for (let i = 0; i < limit; i++) {
              counter += 1;
            }
            return counter;
          }
        skills: [javascript.variables, javascript.loops, javascript.functions]
        level: 2
        difficultyScore: 20
        tags: [variables, re-assignment, const-vs-let, bugfix-scenario]
        guidance: supported
        checks:
          - type: functionExists
            name: countUp
          - type: functionReturns
            name: countUp
            args: [5]
            value: 5
          - type: functionReturns
            name: countUp
            args: [-1]
            value: 0
        hints:
          - level: 1
            message: const variables cannot be reassigned after declaration.
          - level: 2
            message: Use let instead of const for variables whose value will change.
          - level: 3
            message: Change const counter = 0; to let counter = 0;.
          - level: 4
            message: |
              function countUp(limit) {
                let counter = 0;
                for (let i = 0; i < limit; i++) {
                  counter += 1;
                }
                return counter;
              }
        reward:
          xp: 20
        requiresRun: false
        runtime: &workerRuntime
          environment: worker
          timeoutMs: 2000
          maxOutputBytes: 16384
          capabilities: {network: false, storage: false, timers: false, dom: false}
        authoring:
          referenceSolution: |
            function countUp(limit) {
              let counter = 0;
              for (let i = 0; i < limit; i++) {
                counter += 1;
              }
              return counter;
            }
          acceptedSolutions:
            - name: direct loop return
              source: |
                function countUp(limit) {
                  return limit > 0 ? limit : 0;
                }
          rejectedSolutions:
            - name: unchanged const assignment
              source: |
                function countUp(limit) {
                  const counter = 0;
                  return limit;
                }

  - id: define-and-return
    revision: 1
    title: Define and Return
    summary: Write a function that returns a value to its caller.
    challenges:
      - id: js-define-greet-023
        revision: 1
        language: javascript
        title: Greet by Name
        instruction: >-
          Complete `greet(name)` so it returns the string `"Hello, "` followed by
          `name`. For example, `greet("Ada")` returns `"Hello, Ada"`.
        starterCode: |
          function greet(name) {
            // Return a greeting string
          }
        skills: [javascript.functions, javascript.strings]
        level: 4
        difficultyScore: 25
        tags: [functions, return, parameters]
        guidance: guided
        checks:
          - type: functionExists
            name: greet
          - type: functionReturns
            name: greet
            args: ["Ada"]
            value: "Hello, Ada"
          - type: functionReturns
            name: greet
            args: ["World"]
            value: "Hello, World"
        hints:
          - level: 1
            message: Use return to send a value back to the caller.
          - level: 2
            message: Join "Hello, " with the name parameter.
          - level: 3
            message: 'return "Hello, " + name;'
          - level: 4
            message: |
              function greet(name) {
                return "Hello, " + name;
              }
        reward:
          xp: 25
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function greet(name) {
              return "Hello, " + name;
            }
          acceptedSolutions:
            - name: template literal
              source: |
                function greet(name) {
                  return `Hello, ${name}`;
                }
          rejectedSolutions:
            - name: prints instead of returning
              source: |
                function greet(name) {
                  console.log("Hello, " + name);
                }

  - id: function-parameters
    revision: 1
    title: Parameters and Arguments
    summary: Accept multiple inputs and use them inside a function.
    challenges:
      - id: js-add-params-024
        revision: 1
        language: javascript
        title: Add Two Numbers
        instruction: >-
          Complete `add(a, b)` so it returns the sum of its two parameters.
        starterCode: |
          function add(a, b) {
            // Return the sum
          }
        skills: [javascript.functions, javascript.arithmetic]
        level: 4
        difficultyScore: 20
        tags: [functions, parameters, arithmetic]
        guidance: guided
        checks:
          - type: functionExists
            name: add
          - type: functionReturns
            name: add
            args: [2, 3]
            value: 5
          - type: functionReturns
            name: add
            args: [10, -4]
            value: 6
          - type: functionReturns
            name: add
            args: [0, 0]
            value: 0
        hints:
          - level: 1
            message: Parameters a and b hold the values passed by the caller.
          - level: 2
            message: Return a + b.
          - level: 3
            message: "return a + b;"
          - level: 4
            message: |
              function add(a, b) {
                return a + b;
              }
        reward:
          xp: 20
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function add(a, b) {
              return a + b;
            }
          acceptedSolutions:
            - name: explicit sum variable
              source: |
                function add(a, b) {
                  const sum = a + b;
                  return sum;
                }
          rejectedSolutions:
            - name: multiplies instead
              source: |
                function add(a, b) {
                  return a * b;
                }

  - id: call-and-compose
    revision: 1
    title: Calling Functions
    summary: Call one function from another and use its return value.
    challenges:
      - id: js-call-double-025
        revision: 1
        language: javascript
        title: Double Then Add
        instruction: >-
          `double(n)` is already written. Complete `doubleThenAdd(n, extra)` so it
          calls `double(n)`, then returns that result plus `extra`.
        starterCode: |
          function double(n) {
            return n * 2;
          }

          function doubleThenAdd(n, extra) {
            // Call double(n), then add extra
          }
        skills: [javascript.functions, javascript.arithmetic]
        level: 4
        difficultyScore: 30
        tags: [functions, call, composition]
        guidance: guided
        checks:
          - type: functionExists
            name: doubleThenAdd
          - type: functionReturns
            name: doubleThenAdd
            args: [5, 1]
            value: 11
          - type: functionReturns
            name: doubleThenAdd
            args: [3, 4]
            value: 10
          - type: functionReturns
            name: doubleThenAdd
            args: [0, 7]
            value: 7
        hints:
          - level: 1
            message: Call double with n to get twice the value.
          - level: 2
            message: Add extra to the value returned by double(n).
          - level: 3
            message: "return double(n) + extra;"
          - level: 4
            message: |
              function double(n) {
                return n * 2;
              }

              function doubleThenAdd(n, extra) {
                return double(n) + extra;
              }
        reward:
          xp: 30
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function double(n) {
              return n * 2;
            }

            function doubleThenAdd(n, extra) {
              return double(n) + extra;
            }
          acceptedSolutions:
            - name: intermediate variable
              source: |
                function double(n) {
                  return n * 2;
                }

                function doubleThenAdd(n, extra) {
                  const doubled = double(n);
                  return doubled + extra;
                }
          rejectedSolutions:
            - name: ignores double helper
              source: |
                function double(n) {
                  return n * 2;
                }

                function doubleThenAdd(n, extra) {
                  return n + extra;
                }

  - id: local-scope
    revision: 1
    title: Local Scope
    summary: Keep temporary values inside a function with local variables.
    challenges:
      - id: js-local-scope-026
        revision: 1
        language: javascript
        title: Compute with a Local Total
        instruction: >-
          Complete `orderTotal(price, quantity)` so it stores `price * quantity`
          in a local variable named `total`, then returns `total`. Do not use a
          global variable.
        starterCode: |
          function orderTotal(price, quantity) {
            // Create a local total, then return it
          }
        skills: [javascript.functions, javascript.variables, javascript.arithmetic]
        level: 4
        difficultyScore: 25
        tags: [functions, scope, locals]
        guidance: guided
        checks:
          - type: functionExists
            name: orderTotal
          - type: functionReturns
            name: orderTotal
            args: [5, 3]
            value: 15
          - type: functionReturns
            name: orderTotal
            args: [10, 2]
            value: 20
          - type: functionReturns
            name: orderTotal
            args: [7, 0]
            value: 0
        hints:
          - level: 1
            message: Declare total inside the function with const or let.
          - level: 2
            message: "const total = price * quantity;"
          - level: 3
            message: Return total after assigning it.
          - level: 4
            message: |
              function orderTotal(price, quantity) {
                const total = price * quantity;
                return total;
              }
        reward:
          xp: 25
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function orderTotal(price, quantity) {
              const total = price * quantity;
              return total;
            }
          acceptedSolutions:
            - name: direct return
              source: |
                function orderTotal(price, quantity) {
                  return price * quantity;
                }
          rejectedSolutions:
            - name: wrong operation
              source: |
                function orderTotal(price, quantity) {
                  const total = price + quantity;
                  return total;
                }

  - id: guard-clauses-pattern
    revision: 1
    title: Clean Guard Clauses
    summary: Return early from functions to handle invalid input boundaries cleanly.
    challenges:
      - id: js-guard-clause-015
        revision: 1
        language: javascript
        title: Refactor with Guard Clauses
        instruction: >-
          Complete `calculateDiscount(user, price)` to return `0` if `user` is null or `price <= 0`.
          Otherwise, return `price * 0.1` (10% discount).
        starterCode: |
          function calculateDiscount(user, price) {
            // Add early guard returns for invalid user or price
          }
        skills: [javascript.conditionals, javascript.functions, javascript.defensive_coding]
        level: 4
        difficultyScore: 35
        tags: [functions, guard-clause, defensive-coding, refactoring]
        guidance: supported
        checks:
          - type: functionExists
            name: calculateDiscount
          - type: functionReturns
            name: calculateDiscount
            args: [{ id: 1 }, 100]
            value: 10
          - type: functionReturns
            name: calculateDiscount
            args: [null, 100]
            value: 0
          - type: functionReturns
            name: calculateDiscount
            args: [{ id: 1 }, -50]
            value: 0
        hints:
          - level: 1
            message: Return 0 immediately if user is null or price is less than or equal to 0.
          - level: 2
            message: Check if !user or price <= 0 and return 0.
          - level: 3
            message: "return price * 0.1;"
          - level: 4
            message: |
              function calculateDiscount(user, price) {
                if (!user || price <= 0) return 0;
                return price * 0.1;
              }
        reward:
          xp: 35
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function calculateDiscount(user, price) {
              if (!user || price <= 0) return 0;
              return price * 0.1;
            }
          acceptedSolutions:
            - name: nested check
              source: |
                function calculateDiscount(user, price) {
                  if (user && price > 0) {
                    return price * 0.1;
                  }
                  return 0;
                }
          rejectedSolutions:
            - name: missing price validation
              source: |
                function calculateDiscount(user, price) {
                  if (!user) return 0;
                  return price * 0.1;
                }

  - id: arrows-and-helpers
    revision: 1
    title: Arrow Helpers
    summary: Write small reusable functions with clear return values.
    challenges:
      - id: js-arrow-triple-099
        revision: 1
        language: javascript
        title: Triple With Arrow
        instruction: >-
          Complete `triple` as an arrow function that returns `n * 3`. Keep
          `demoTriple()` as written.
        starterCode: |
          const triple = (n) => {
            // Return n * 3
          };

          function demoTriple() {
            return [triple(2), triple(5)];
          }
        skills: [javascript.functions, javascript.arithmetic]
        level: 4
        difficultyScore: 20
        tags: [functions, arrow]
        guidance: guided
        checks:
          - {type: functionExists, name: triple}
          - {type: functionExists, name: demoTriple}
          - {type: functionReturns, name: demoTriple, args: [], value: [6, 15]}
        hints:
          - level: 1
            message: Arrow functions can return an expression from the body.
          - level: 2
            message: "return n * 3;"
          - level: 3
            message: You may also write const triple = (n) => n * 3;
          - level: 4
            message: |
              const triple = (n) => n * 3;

              function demoTriple() {
                return [triple(2), triple(5)];
              }
        reward: {xp: 20}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            const triple = (n) => n * 3;

            function demoTriple() {
              return [triple(2), triple(5)];
            }
          acceptedSolutions:
            - name: block body
              source: |
                const triple = (n) => {
                  return n * 3;
                };

                function demoTriple() {
                  return [triple(2), triple(5)];
                }
          rejectedSolutions:
            - name: doubles
              source: |
                const triple = (n) => n * 2;

                function demoTriple() {
                  return [triple(2), triple(5)];
                }

      - id: js-max-of-two-100
        revision: 1
        language: javascript
        title: Max of Two
        instruction: >-
          Complete `maxOfTwo(a, b)` so it returns the larger of the two numbers.
          If they are equal, return that shared value.
        starterCode: |
          function maxOfTwo(a, b) {
            // Return the larger value
          }
        skills: [javascript.functions, javascript.comparisons, javascript.conditionals]
        level: 3
        difficultyScore: 20
        tags: [functions, comparisons]
        guidance: guided
        checks:
          - {type: functionExists, name: maxOfTwo}
          - {type: functionReturns, name: maxOfTwo, args: [3, 8], value: 8}
          - {type: functionReturns, name: maxOfTwo, args: [9, 2], value: 9}
          - {type: functionReturns, name: maxOfTwo, args: [4, 4], value: 4}
        hints:
          - level: 1
            message: Compare a and b with > or >=.
          - level: 2
            message: Return a when a is larger, otherwise return b.
          - level: 3
            message: Math.max(a, b) is also fine.
          - level: 4
            message: |
              function maxOfTwo(a, b) {
                if (a > b) return a;
                return b;
              }
        reward: {xp: 20}
        requiresRun: false
        runtime: *workerRuntime
        authoring:
          referenceSolution: |
            function maxOfTwo(a, b) {
              if (a > b) return a;
              return b;
            }
          acceptedSolutions:
            - name: Math.max
              source: |
                function maxOfTwo(a, b) {
                  return Math.max(a, b);
                }
          rejectedSolutions:
            - name: returns sum
              source: |
                function maxOfTwo(a, b) {
                  return a + b;
                }
