    acceptedSolutions:
      - name: binary search plus BFS
        source: |
          function swimInWater(grid) {
            const n = grid.length;
            const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            let hi = 0;
            for (let r = 0; r < n; r++) {
              for (let c = 0; c < n; c++) if (grid[r][c] > hi) hi = grid[r][c];
            }
            function can(t) {
              if (grid[0][0] > t) return false;
              const seen = Array.from({ length: n }, () => Array(n).fill(false));
              const queue = [[0, 0]];
              seen[0][0] = true;
              for (let i = 0; i < queue.length; i++) {
                const [r, c] = queue[i];
                if (r === n - 1 && c === n - 1) return true;
                for (const [dr, dc] of dirs) {
                  const nr = r + dr;
                  const nc = c + dc;
                  if (
                    nr >= 0 && nr < n && nc >= 0 && nc < n &&
                    !seen[nr][nc] && grid[nr][nc] <= t
                  ) {
                    seen[nr][nc] = true;
                    queue.push([nr, nc]);
                  }
                }
              }
              return false;
            }
            let lo = grid[0][0];
            while (lo < hi) {
              const mid = Math.floor((lo + hi) / 2);
              if (can(mid)) hi = mid;
              else lo = mid + 1;
            }
            return lo;
          }
    rejectedSolutions:
      - name: end cell only
        source: |
          function swimInWater(grid) {
            const n = grid.length;
            return grid[n - 1][n - 1];
          }
