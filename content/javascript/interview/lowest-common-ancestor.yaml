    acceptedSolutions:
      - name: parent map
        source: |
          function lowestCommonAncestor(root, p, q) {
            const parent = new Map();
            const stack = [root];
            parent.set(root, null);
            while (!parent.has(p) || !parent.has(q)) {
              const node = stack.pop();
              if (node.left) {
                parent.set(node.left, node);
                stack.push(node.left);
              }
              if (node.right) {
                parent.set(node.right, node);
                stack.push(node.right);
              }
            }
            const seen = new Set();
            let cur = p;
            while (cur) {
              seen.add(cur);
              cur = parent.get(cur);
            }
            cur = q;
            while (!seen.has(cur)) cur = parent.get(cur);
            return cur;
          }

          function demoLca() {
            const n6 = { val: 6, left: null, right: null };
            const n2 = { val: 2, left: null, right: null };
            const n5 = { val: 5, left: n6, right: n2 };
            const n1 = { val: 1, left: null, right: null };
            const n3 = { val: 3, left: n5, right: n1 };
            return [
              lowestCommonAncestor(n3, n5, n1).val,
              lowestCommonAncestor(n3, n6, n2).val,
              lowestCommonAncestor(n3, n5, n2).val,
            ];
          }
