    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function climbStairs(n) {
        if (n <= 2) return n;
        let a = 1;
        let b = 2;
        for (let i = 3; i <= n; i++) {
          const next = a + b;
          a = b;
          b = next;
        }
        return b;
      }
    acceptedSolutions:
      - name: recursive memo
        source: |
          function climbStairs(n) {
            const memo = { 1: 1, 2: 2 };
            function ways(k) {
              if (memo[k] !== undefined) return memo[k];
              memo[k] = ways(k - 1) + ways(k - 2);
              return memo[k];
            }
            return ways(n);
          }
      - name: dp array
        source: |
          function climbStairs(n) {
            if (n <= 2) return n;
            const dp = new Array(n + 1);
            dp[1] = 1;
            dp[2] = 2;
            for (let i = 3; i <= n; i++) dp[i] = dp[i - 1] + dp[i - 2];
            return dp[n];
          }
    rejectedSolutions:
      - name: returns n
        source: |
          function climbStairs(n) {
            return n;
          }
