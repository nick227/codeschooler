    acceptedSolutions:
      - name: object counters
        source: |
          function minWindow(s, t) {
            if (!t) return "";
            const need = {};
            for (const ch of t) need[ch] = (need[ch] || 0) + 1;
            let missing = t.length;
            let best = "";
            let left = 0;
            for (let right = 0; right < s.length; right++) {
              const ch = s[right];
              if (need[ch] !== undefined) {
                if (need[ch] > 0) missing -= 1;
                need[ch] -= 1;
              }
              while (missing === 0) {
                const candidate = s.slice(left, right + 1);
                if (!best || candidate.length < best.length) best = candidate;
                const leftCh = s[left];
                if (need[leftCh] !== undefined) {
                  need[leftCh] += 1;
                  if (need[leftCh] > 0) missing += 1;
                }
                left += 1;
              }
            }
            return best;
          }
    rejectedSolutions:
      - name: returns t if included as subsequence loosely
        source: |
          function minWindow(s, t) {
            let i = 0;
            for (const ch of s) {
              if (ch === t[i]) i += 1;
              if (i === t.length) return t;
            }
            return "";
          }
