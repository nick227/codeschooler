  authoring:
    referenceSolution: |
      function hasCycle(head) {
        let slow = head;
        let fast = head;
        while (fast && fast.next) {
          slow = slow.next;
          fast = fast.next.next;
          if (slow === fast) return true;
        }
        return false;
      }

      function demoCycle() {
        const a = { val: 1, next: null };
        const b = { val: 2, next: null };
        const c = { val: 3, next: null };
        a.next = b;
        b.next = c;
        c.next = b;
        const x = { val: 1, next: { val: 2, next: null } };
        return [hasCycle(a), hasCycle(x), hasCycle(null)];
      }
    acceptedSolutions:
      - name: seen set
        source: |
          function hasCycle(head) {
            const seen = new Set();
            let node = head;
            while (node) {
              if (seen.has(node)) return true;
              seen.add(node);
              node = node.next;
            }
            return false;
          }

          function demoCycle() {
            const a = { val: 1, next: null };
            const b = { val: 2, next: null };
            const c = { val: 3, next: null };
            a.next = b;
            b.next = c;
            c.next = b;
            const x = { val: 1, next: { val: 2, next: null } };
            return [hasCycle(a), hasCycle(x), hasCycle(null)];
          }
    rejectedSolutions:
      - name: always false
        source: |
          function hasCycle(head) {
            return false;
          }

          function demoCycle() {
            const a = { val: 1, next: null };
            const b = { val: 2, next: null };
            const c = { val: 3, next: null };
            a.next = b;
            b.next = c;
            c.next = b;
            const x = { val: 1, next: { val: 2, next: null } };
            return [hasCycle(a), hasCycle(x), hasCycle(null)];
          }
