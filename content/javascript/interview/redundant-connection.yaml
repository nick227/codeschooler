challenge:
  id: js-interview-redundant-connection-001
  revision: 1
  language: javascript
  title: Redundant Connection
  level: 11
  difficultyScore: 60
  tags: [interview, union-find, graphs]
  instruction: >-
    You are given a list of undirected edges that started as a tree with `n`
    nodes labeled `1..n`, then one extra edge was added. Complete
    `findRedundantConnection(edges)` so it returns the edge that can be removed
    to restore a tree (the last edge that forms a cycle when processed in order).
  starterCode: |
    function findRedundantConnection(edges) {
      // Union-Find: return the first edge whose ends share a parent
    }
  skills: [javascript.algorithms_union_find, javascript.graphs, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: findRedundantConnection}
    - {type: functionReturns, name: findRedundantConnection, args: [[[1, 2], [1, 3], [2, 3]]], value: [2, 3]}
    - {type: functionReturns, name: findRedundantConnection, args: [[[1, 2], [2, 3], [3, 4], [1, 4], [1, 5]]], value: [1, 4]}
  hints:
    - level: 1
      message: Keep a parent array for each node.
    - level: 2
      message: find(x) walks to the root; union links two roots.
    - level: 3
      message: If an edge connects two nodes already in the same set, it is redundant.
    - level: 4
      message: |
        function findRedundantConnection(edges) {
          const parent = [];
          for (let i = 0; i <= edges.length; i++) parent[i] = i;
          function find(x) {
            if (parent[x] !== x) parent[x] = find(parent[x]);
            return parent[x];
          }
          for (const [a, b] of edges) {
            const pa = find(a);
            const pb = find(b);
            if (pa === pb) return [a, b];
            parent[pa] = pb;
          }
          return [];
        }
