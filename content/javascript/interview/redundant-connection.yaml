    acceptedSolutions:
      - name: iterative find
        source: |
          function findRedundantConnection(edges) {
            const parent = Array.from({ length: edges.length + 1 }, (_, i) => i);
            function find(x) {
              while (parent[x] !== x) x = parent[x];
              return x;
            }
            for (const [a, b] of edges) {
              const pa = find(a);
              const pb = find(b);
              if (pa === pb) return [a, b];
              parent[pa] = pb;
            }
            return [];
          }
    rejectedSolutions:
      - name: returns first edge
        source: |
          function findRedundantConnection(edges) {
            return edges[0];
          }
