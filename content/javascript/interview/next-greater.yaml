    acceptedSolutions:
      - name: brute force
        source: |
          function nextGreater(nums) {
            const answer = [];
            for (let i = 0; i < nums.length; i++) {
              let next = -1;
              for (let j = i + 1; j < nums.length; j++) {
                if (nums[j] > nums[i]) {
                  next = nums[j];
                  break;
                }
              }
              answer.push(next);
            }
            return answer;
          }
    rejectedSolutions:
      - name: always -1
        source: |
          function nextGreater(nums) {
            return nums.map(() => -1);
          }
