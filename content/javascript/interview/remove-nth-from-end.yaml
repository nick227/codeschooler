      function removeNthFromEnd(head, n) {
        const dummy = { val: 0, next: head };
        let lead = dummy;
        let trail = dummy;
        for (let i = 0; i < n + 1; i++) lead = lead.next;
        while (lead) {
          lead = lead.next;
          trail = trail.next;
        }
        trail.next = trail.next.next;
        return dummy.next;
      }

