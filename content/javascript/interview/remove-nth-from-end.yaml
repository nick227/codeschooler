id: js-interview-remove-nth-from-end
revision: 1
title: Remove Nth Node From End of List
summary: >-
  Two pointers separated by n steps — when the lead hits null, the trail sits
  just before the node to delete.
difficulty: medium
pattern: linked-lists
challenge:
  id: js-interview-remove-nth-from-end-001
  revision: 1
  language: javascript
  title: Remove Nth Node From End of List
  level: 11
  difficultyScore: 55
  instruction: |
    Given the head of a singly linked list, remove the nth node from the end and
    return the new head. Nodes are `{ val, next }`.

    Why two pointers:
    A first pass can count length, then delete length-n. The elegant one-pass
    pattern advances a lead pointer n+1 steps (with a dummy head), then walks
    lead and trail together. When lead is null, trail.next is the target.

    Dummy head matters when removing the original first node (n === length).

    Keep `demoRemove()` as written — list 1..5, remove n=2 -> [1,2,3,5].

    Complete `removeNthFromEnd(head, n)`.
  starterCode: |
    function removeNthFromEnd(head, n) {
      // Dummy + two pointers gap of n
    }

    function demoRemove() {
      const e = { val: 5, next: null };
      const d = { val: 4, next: e };
      const c = { val: 3, next: d };
      const b = { val: 2, next: c };
      const a = { val: 1, next: b };
      let node = removeNthFromEnd(a, 2);
      const out = [];
      while (node) {
        out.push(node.val);
        node = node.next;
      }
      return out;
    }

    function demoRemoveHead() {
      const b = { val: 2, next: null };
      const a = { val: 1, next: b };
      let node = removeNthFromEnd(a, 2);
      const out = [];
      while (node) {
        out.push(node.val);
        node = node.next;
      }
      return out;
    }
