    acceptedSolutions:
      - name: count length first
        source: |
          function removeNthFromEnd(head, n) {
            let length = 0;
            for (let node = head; node; node = node.next) length += 1;
            const dummy = { val: 0, next: head };
            let cur = dummy;
            for (let i = 0; i < length - n; i++) cur = cur.next;
            cur.next = cur.next.next;
            return dummy.next;
          }

          function demoRemove() {
            const e = { val: 5, next: null };
            const d = { val: 4, next: e };
            const c = { val: 3, next: d };
            const b = { val: 2, next: c };
            const a = { val: 1, next: b };
            let node = removeNthFromEnd(a, 2);
            const out = [];
            while (node) {
              out.push(node.val);
              node = node.next;
            }
            return out;
          }

          function demoRemoveHead() {
            const b = { val: 2, next: null };
            const a = { val: 1, next: b };
            let node = removeNthFromEnd(a, 2);
            const out = [];
            while (node) {
              out.push(node.val);
              node = node.next;
            }
            return out;
          }
    rejectedSolutions:
      - name: always drops last
        source: |
          function removeNthFromEnd(head) {
            if (!head || !head.next) return null;
            let cur = head;
            while (cur.next.next) cur = cur.next;
            cur.next = null;
            return head;
          }

          function demoRemove() {
            const e = { val: 5, next: null };
