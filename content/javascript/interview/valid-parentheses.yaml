id: js-interview-valid-parentheses
revision: 1
title: Valid Parentheses
summary: Use a stack to check whether brackets are correctly matched and nested.
difficulty: easy
pattern: stacks
challenge:
  id: js-interview-valid-parentheses-001
  revision: 1
  language: javascript
  title: Valid Parentheses
  level: 10
  difficultyScore: 50
  tags: [interview, stack, strings]
  instruction: >-
    Complete `isValid(s)` so it returns `true` when `s` contains only valid
    parentheses pairs `()`, `[]`, and `{}` in correct nesting order.
  starterCode: |
    function isValid(s) {
      // Use a stack of opening brackets
    }
  skills: [javascript.stacks, javascript.strings, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: isValid}
    - {type: functionReturns, name: isValid, args: ["()"], value: true}
    - {type: functionReturns, name: isValid, args: ["()[]{}"], value: true}
    - {type: functionReturns, name: isValid, args: ["(]"], value: false}
    - {type: functionReturns, name: isValid, args: ["([)]"], value: false}
    - {type: functionReturns, name: isValid, args: [""], value: true}
  hints:
    - level: 1
      message: Push opening brackets; on a closer, check the top of the stack.
    - level: 2
      message: Map each closing bracket to the opening bracket it requires.
    - level: 3
      message: Return false if the stack is empty when a closer appears, or the top mismatches.
    - level: 4
      message: |
        function isValid(s) {
          const stack = [];
          const pairs = { ")": "(", "]": "[", "}": "{" };
          for (const ch of s) {
            if (ch === "(" || ch === "[" || ch === "{") stack.push(ch);
            else {
              if (stack.pop() !== pairs[ch]) return false;
            }
          }
          return stack.length === 0;
        }
