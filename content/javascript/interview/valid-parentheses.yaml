      function isValid(s) {
        const stack = [];
        const pairs = { ")": "(", "]": "[", "}": "{" };
        for (const ch of s) {
          if (ch === "(" || ch === "[" || ch === "{") stack.push(ch);
          else {
            if (stack.pop() !== pairs[ch]) return false;
          }
        }
        return stack.length === 0;
      }
    acceptedSolutions:
      - name: explicit switch
        source: |
          function isValid(s) {
            const stack = [];
            for (const ch of s) {
              if (ch === "(" || ch === "[" || ch === "{") stack.push(ch);
              else {
                const top = stack.pop();
                if (ch === ")" && top !== "(") return false;
                if (ch === "]" && top !== "[") return false;
                if (ch === "}" && top !== "{") return false;
              }
            }
            return stack.length === 0;
          }
    rejectedSolutions:
      - name: counts only
        source: |
          function isValid(s) {
            let n = 0;
            for (const ch of s) {
              if (ch === "(" || ch === "[" || ch === "{") n += 1;
              else n -= 1;
              if (n < 0) return false;
            }
            return n === 0;
          }
