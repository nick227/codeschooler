    acceptedSolutions:
      - name: full sort each query
        source: |
          function createMedianFinder() {
            const nums = [];
            return {
              addNum(num) {
                nums.push(num);
              },
              findMedian() {
                const sorted = nums.slice().sort((a, b) => a - b);
                const mid = Math.floor(sorted.length / 2);
                if (sorted.length % 2) return sorted[mid];
                return (sorted[mid - 1] + sorted[mid]) / 2;
              },
            };
          }

          function demoMedianStream() {
            const mf = createMedianFinder();
            mf.addNum(1);
            mf.addNum(2);
            const a = mf.findMedian();
            mf.addNum(3);
            const b = mf.findMedian();
            return [a, b];
          }

          function demoMedianOddEven() {
            const mf = createMedianFinder();
            mf.addNum(6);
            const a = mf.findMedian();
            mf.addNum(10);
            const b = mf.findMedian();
            mf.addNum(2);
            const c = mf.findMedian();
            mf.addNum(6);
            const d = mf.findMedian();
            mf.addNum(5);
            const e = mf.findMedian();
            return [a, b, c, d, e];
          }
    rejectedSolutions:
      - name: always last number
        source: |
          function createMedianFinder() {
            let last = 0;
            return {
              addNum(num) {
                last = num;
              },
              findMedian() {
                return last;
              },
            };
          }

