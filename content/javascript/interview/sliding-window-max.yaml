    acceptedSolutions:
      - name: scan each window
        source: |
          function maxSlidingWindow(nums, k) {
            const out = [];
            for (let i = 0; i <= nums.length - k; i++) {
              let best = nums[i];
              for (let j = i; j < i + k; j++) {
                if (nums[j] > best) best = nums[j];
              }
              out.push(best);
            }
            return out;
          }
    rejectedSolutions:
