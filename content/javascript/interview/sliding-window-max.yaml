  tags: [interview, sliding-window, deque, arrays]
  instruction: >-
    Complete `maxSlidingWindow(nums, k)` so it returns an array of the maximum
    value in every contiguous window of length `k`. Prefer an O(N) deque of
    indices (monotonic decreasing). Assume `nums.length >= k` and `k >= 1`.
  starterCode: |
    function maxSlidingWindow(nums, k) {
      // Monotonic deque of indices
    }
  skills: [javascript.algorithms_deque_window, javascript.algorithms_sliding_window, javascript.queues, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: maxSlidingWindow}
    - {type: functionReturns, name: maxSlidingWindow, args: [[1, 3, -1, -3, 5, 3, 6, 7], 3], value: [3, 3, 5, 5, 6, 7]}
    - {type: functionReturns, name: maxSlidingWindow, args: [[1], 1], value: [1]}
    - {type: functionReturns, name: maxSlidingWindow, args: [[9, 11], 2], value: [11]}
  hints:
    - level: 1
      message: Keep deque indices in decreasing nums order from front to back.
    - level: 2
      message: Drop indices that fall out of the left edge of the window.
    - level: 3
      message: The front of the deque is the current window maximum index.
    - level: 4
      message: |
        function maxSlidingWindow(nums, k) {
          const deque = [];
          const out = [];
          for (let i = 0; i < nums.length; i++) {
            while (deque.length && deque[0] <= i - k) deque.shift();
            while (deque.length && nums[deque[deque.length - 1]] <= nums[i]) deque.pop();
            deque.push(i);
            if (i >= k - 1) out.push(nums[deque[0]]);
          }
          return out;
        }
