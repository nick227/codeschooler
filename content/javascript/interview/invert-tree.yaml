    acceptedSolutions:
      - name: swap then recurse
        source: |
          function invertTree(root) {
            if (!root) return null;
            const tmp = root.left;
            root.left = root.right;
            root.right = tmp;
            invertTree(root.left);
            invertTree(root.right);
            return root;
          }

          function demoInvert() {
            const root = {
              val: 1,
              left: { val: 2, left: null, right: null },
              right: { val: 3, left: null, right: null },
            };
            invertTree(root);
            const out = [];
            function preorder(node) {
              if (!node) return;
              out.push(node.val);
              preorder(node.left);
              preorder(node.right);
            }
            preorder(root);
            return out;
          }
