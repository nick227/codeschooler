    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function kthSmallest(root, k) {
        const stack = [];
        let cur = root;
        let remaining = k;
        while (true) {
          while (cur) {
            stack.push(cur);
            cur = cur.left;
          }
          const node = stack.pop();
          remaining -= 1;
          if (remaining === 0) return node.val;
          cur = node.right;
        }
      }

      function demoTree() {
        return {
          val: 3,
          left: {
            val: 1,
            left: null,
            right: { val: 2, left: null, right: null },
          },
          right: { val: 4, left: null, right: null },
        };
      }

      function demoKth() {
        return kthSmallest(demoTree(), 1);
      }

      function demoKth3() {
        return kthSmallest(demoTree(), 3);
      }
    acceptedSolutions:
      - name: collect inorder array
        source: |
          function kthSmallest(root, k) {
            const vals = [];
            function inorder(node) {
              if (!node) return;
              inorder(node.left);
              vals.push(node.val);
              inorder(node.right);
            }
            inorder(root);
            return vals[k - 1];
          }

          function demoTree() {
            return {
              val: 3,
              left: {
                val: 1,
                left: null,
                right: { val: 2, left: null, right: null },
              },
              right: { val: 4, left: null, right: null },
            };
          }

          function demoKth() {
            return kthSmallest(demoTree(), 1);
          }

          function demoKth3() {
            return kthSmallest(demoTree(), 3);
          }
    rejectedSolutions:
      - name: returns root value
        source: |
          function kthSmallest(root) {
            return root.val;
          }

          function demoTree() {
            return {
              val: 3,
              left: {
                val: 1,
                left: null,
                right: { val: 2, left: null, right: null },
              },
              right: { val: 4, left: null, right: null },
            };
          }

          function demoKth() {
            return kthSmallest(demoTree(), 1);
          }

          function demoKth3() {
            return kthSmallest(demoTree(), 3);
          }
