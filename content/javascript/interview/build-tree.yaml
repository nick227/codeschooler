  authoring:
    referenceSolution: |
      function buildTree(preorder, inorder) {
        const index = new Map();
        inorder.forEach((v, i) => index.set(v, i));
        let preIndex = 0;
        function helper(lo, hi) {
          if (lo > hi) return null;
          const val = preorder[preIndex++];
          const mid = index.get(val);
          return {
            val,
            left: helper(lo, mid - 1),
            right: helper(mid + 1, hi),
          };
        }
        return helper(0, inorder.length - 1);
      }

      function demoBuild() {
        const root = buildTree([3, 9, 20, 15, 7], [9, 3, 15, 20, 7]);
        function shape(node) {
          if (!node) return null;
          return [node.val, shape(node.left), shape(node.right)];
        }
        return shape(root);
      }
    acceptedSolutions:
      - name: slice recursion
        source: |
          function buildTree(preorder, inorder) {
            if (!preorder.length) return null;
            const val = preorder[0];
            const mid = inorder.indexOf(val);
            return {
              val,
              left: buildTree(preorder.slice(1, mid + 1), inorder.slice(0, mid)),
              right: buildTree(preorder.slice(mid + 1), inorder.slice(mid + 1)),
            };
          }

          function demoBuild() {
            const root = buildTree([3, 9, 20, 15, 7], [9, 3, 15, 20, 7]);
            function shape(node) {
              if (!node) return null;
              return [node.val, shape(node.left), shape(node.right)];
            }
            return shape(root);
          }
    rejectedSolutions:
      - name: root only
        source: |
          function buildTree(preorder) {
            return { val: preorder[0], left: null, right: null };
          }

          function demoBuild() {
            const root = buildTree([3, 9, 20, 15, 7], [9, 3, 15, 20, 7]);
            function shape(node) {
              if (!node) return null;
              return [node.val, shape(node.left), shape(node.right)];
            }
            return shape(root);
          }
