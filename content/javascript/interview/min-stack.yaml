    acceptedSolutions:
      - name: store pairs
        source: |
          function createMinStack() {
            const stack = [];
            return {
              push(val) {
                const min = stack.length ? Math.min(val, stack[stack.length - 1].min) : val;
                stack.push({ val, min });
              },
              pop() {
                stack.pop();
              },
              top() {
                return stack[stack.length - 1].val;
              },
              getMin() {
                return stack[stack.length - 1].min;
              },
            };
          }

          function demoMinStack() {
            const stack = createMinStack();
            stack.push(-2);
            stack.push(0);
            stack.push(-3);
            const a = stack.getMin();
            stack.pop();
            const b = stack.top();
            const c = stack.getMin();
            return [a, b, c];
          }
    rejectedSolutions:
      - name: min is always first pushed
        source: |
          function createMinStack() {
            const values = [];
            return {
              push(val) {
                values.push(val);
              },
              pop() {
                values.pop();
              },
              top() {
                return values[values.length - 1];
              },
              getMin() {
                return values[0];
              },
            };
          }

          function demoMinStack() {
            const stack = createMinStack();
            stack.push(-2);
            stack.push(0);
            stack.push(-3);
            const a = stack.getMin();
            stack.pop();
            const b = stack.top();
            const c = stack.getMin();
            return [a, b, c];
          }
