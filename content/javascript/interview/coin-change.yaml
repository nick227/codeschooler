id: js-interview-coin-change
revision: 1
title: Coin Change
summary: Find the fewest coins that sum to an amount with unbounded knapsack DP.
difficulty: medium
pattern: dynamic-programming
challenge:
  id: js-interview-coin-change-001
  revision: 1
  language: javascript
  title: Coin Change
  level: 11
  difficultyScore: 65
  tags: [interview, dp, arrays]
  instruction: >-
    Complete `coinChange(coins, amount)` so it returns the fewest number of coins
    needed to make `amount`. Each coin may be reused unlimited times. Return
    `-1` when it is impossible.
  starterCode: |
    function coinChange(coins, amount) {
      // Bottom-up min coins DP
    }
  skills: [javascript.algorithms_dp, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: coinChange}
    - {type: functionReturns, name: coinChange, args: [[1, 2, 5], 11], value: 3}
    - {type: functionReturns, name: coinChange, args: [[1, 3, 4], 6], value: 2}
    - {type: functionReturns, name: coinChange, args: [[2], 3], value: -1}
    - {type: functionReturns, name: coinChange, args: [[1], 0], value: 0}
  hints:
    - level: 1
      message: Let dp[x] be the fewest coins to make sum x.
    - level: 2
      message: "dp[x] = min over coins of 1 + dp[x - coin] when x >= coin"
    - level: 3
      message: Initialize dp with a sentinel larger than any answer; dp[0] = 0.
    - level: 4
      message: |
        function coinChange(coins, amount) {
          const dp = new Array(amount + 1).fill(amount + 1);
          dp[0] = 0;
          for (let x = 1; x <= amount; x++) {
            for (const coin of coins) {
              if (coin <= x) dp[x] = Math.min(dp[x], dp[x - coin] + 1);
            }
          }
          return dp[amount] > amount ? -1 : dp[amount];
        }
  reward: {xp: 60}
  requiresRun: false
  runtime: &workerRuntime
    environment: worker
    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function coinChange(coins, amount) {
        const dp = new Array(amount + 1).fill(amount + 1);
        dp[0] = 0;
        for (let x = 1; x <= amount; x++) {
          for (const coin of coins) {
            if (coin <= x) dp[x] = Math.min(dp[x], dp[x - coin] + 1);
          }
        }
        return dp[amount] > amount ? -1 : dp[amount];
      }
    acceptedSolutions:
      - name: coin outer loop
        source: |
          function coinChange(coins, amount) {
            const dp = new Array(amount + 1).fill(Infinity);
            dp[0] = 0;
            for (const coin of coins) {
              for (let x = coin; x <= amount; x++) {
                dp[x] = Math.min(dp[x], dp[x - coin] + 1);
              }
            }
            return dp[amount] === Infinity ? -1 : dp[amount];
          }
    rejectedSolutions:
      - name: greedy largest first
        source: |
          function coinChange(coins, amount) {
            const sorted = coins.slice().sort((a, b) => b - a);
            let left = amount;
            let count = 0;
            for (const coin of sorted) {
              while (left >= coin) {
                left -= coin;
                count += 1;
              }
            }
            return left === 0 ? count : -1;
          }
