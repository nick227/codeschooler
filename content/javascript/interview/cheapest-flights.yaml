  authoring:
    referenceSolution: |
      function findCheapestPrice(n, flights, src, dst, k) {
        let dist = new Array(n).fill(Infinity);
        dist[src] = 0;
        for (let hops = 0; hops <= k; hops++) {
          const prev = dist.slice();
          for (const [u, v, w] of flights) {
            if (prev[u] + w < dist[v]) dist[v] = prev[u] + w;
          }
        }
        return dist[dst] === Infinity ? -1 : dist[dst];
      }
    acceptedSolutions:
      - name: named hop loop
        source: |
          function findCheapestPrice(n, flights, src, dst, k) {
            let prices = new Array(n).fill(Number.POSITIVE_INFINITY);
            prices[src] = 0;
            for (let edgeCount = 0; edgeCount <= k; edgeCount++) {
              const prior = prices.slice();
              for (const flight of flights) {
                const from = flight[0];
                const to = flight[1];
                const cost = flight[2];
                if (prior[from] + cost < prices[to]) prices[to] = prior[from] + cost;
              }
            }
            return Number.isFinite(prices[dst]) ? prices[dst] : -1;
          }
    rejectedSolutions:
      - name: unlimited Dijkstra ignores k
        source: |
          function findCheapestPrice(n, flights, src, dst) {
            const graph = Array.from({ length: n }, () => []);
            for (const [u, v, w] of flights) graph[u].push([v, w]);
            const dist = new Array(n).fill(Infinity);
            dist[src] = 0;
            const seen = new Array(n).fill(false);
            for (let iter = 0; iter < n; iter++) {
              let node = -1;
              for (let i = 0; i < n; i++) {
                if (!seen[i] && (node === -1 || dist[i] < dist[node])) node = i;
              }
              if (node === -1 || dist[node] === Infinity) break;
              seen[node] = true;
              for (const [to, w] of graph[node]) {
                if (dist[node] + w < dist[to]) dist[to] = dist[node] + w;
              }
            }
            return dist[dst] === Infinity ? -1 : dist[dst];
          }
