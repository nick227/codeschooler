    referenceSolution: |
      function createTimeMap() {
        const store = new Map();
        return {
          set(key, value, timestamp) {
            if (!store.has(key)) store.set(key, []);
            store.get(key).push({ timestamp, value });
          },
          get(key, timestamp) {
            const arr = store.get(key);
            if (!arr || !arr.length) return "";
            let lo = 0;
            let hi = arr.length - 1;
            let ans = -1;
            while (lo <= hi) {
              const mid = Math.floor((lo + hi) / 2);
              if (arr[mid].timestamp <= timestamp) {
                ans = mid;
                lo = mid + 1;
              } else hi = mid - 1;
            }
            return ans === -1 ? "" : arr[ans].value;
          },
        };
      }

      function demoTimeMap() {
        const map = createTimeMap();
        map.set("foo", "bar", 1);
        const a = map.get("foo", 1);
        const b = map.get("foo", 3);
        map.set("foo", "bar2", 4);
        const c = map.get("foo", 4);
        const d = map.get("foo", 5);
        return [a, b, c, d];
      }

      function demoMissing() {
        const map = createTimeMap();
        map.set("love", "high", 10);
        map.set("love", "low", 20);
        return [map.get("love", 5), map.get("love", 10), map.get("love", 15), map.get("love", 20), map.get("love", 25)];
      }
    acceptedSolutions:
      - name: linear scan from end
        source: |
          function createTimeMap() {
            const store = new Map();
            return {
              set(key, value, timestamp) {
                if (!store.has(key)) store.set(key, []);
                store.get(key).push({ timestamp, value });
              },
              get(key, timestamp) {
                const arr = store.get(key);
                if (!arr) return "";
                for (let i = arr.length - 1; i >= 0; i--) {
                  if (arr[i].timestamp <= timestamp) return arr[i].value;
                }
                return "";
              },
            };
          }

          function demoTimeMap() {
            const map = createTimeMap();
            map.set("foo", "bar", 1);
            const a = map.get("foo", 1);
            const b = map.get("foo", 3);
            map.set("foo", "bar2", 4);
            const c = map.get("foo", 4);
            const d = map.get("foo", 5);
            return [a, b, c, d];
          }

          function demoMissing() {
            const map = createTimeMap();
            map.set("love", "high", 10);
            map.set("love", "low", 20);
            return [map.get("love", 5), map.get("love", 10), map.get("love", 15), map.get("love", 20), map.get("love", 25)];
          }
    rejectedSolutions:
      - name: exact timestamp only
        source: |
          function createTimeMap() {
            const store = new Map();
            return {
              set(key, value, timestamp) {
                if (!store.has(key)) store.set(key, new Map());
                store.get(key).set(timestamp, value);
              },
              get(key, timestamp) {
                const m = store.get(key);
                if (!m || !m.has(timestamp)) return "";
                return m.get(timestamp);
              },
            };
          }

          function demoTimeMap() {
            const map = createTimeMap();
            map.set("foo", "bar", 1);
            const a = map.get("foo", 1);
            const b = map.get("foo", 3);
            map.set("foo", "bar2", 4);
            const c = map.get("foo", 4);
            const d = map.get("foo", 5);
            return [a, b, c, d];
          }

          function demoMissing() {
            const map = createTimeMap();
            map.set("love", "high", 10);
            map.set("love", "low", 20);
            return [map.get("love", 5), map.get("love", 10), map.get("love", 15), map.get("love", 20), map.get("love", 25)];
          }
