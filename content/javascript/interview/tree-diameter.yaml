    acceptedSolutions:
      - name: explicit height helper
        source: |
          function diameterOfBinaryTree(root) {
            let best = 0;
            function height(node) {
              if (!node) return 0;
              const left = height(node.left);
              const right = height(node.right);
              if (left + right > best) best = left + right;
              return Math.max(left, right) + 1;
            }
            height(root);
            return best;
          }

          function demoDiameter() {
            const root = {
              val: 1,
              left: {
                val: 2,
                left: { val: 4, left: null, right: null },
                right: { val: 5, left: null, right: null },
              },
              right: { val: 3, left: null, right: null },
            };
            return [diameterOfBinaryTree(root), diameterOfBinaryTree(null)];
          }
    rejectedSolutions:
      - name: returns max depth
        source: |
          function diameterOfBinaryTree(root) {
            function depth(node) {
              if (!node) return 0;
              return 1 + Math.max(depth(node.left), depth(node.right));
            }
            const d = depth(root);
            return d === 0 ? 0 : d - 1;
          }

          function demoDiameter() {
            const root = {
              val: 1,
              left: {
                val: 2,
                left: { val: 4, left: null, right: null },
                right: { val: 5, left: null, right: null },
              },
              right: { val: 3, left: null, right: null },
            };
            return [diameterOfBinaryTree(root), diameterOfBinaryTree(null)];
          }
