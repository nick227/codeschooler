id: js-interview-search-2d-matrix
revision: 1
title: Search a 2D Matrix
summary: >-
  Treat the matrix as a virtual sorted array — binary search with row =
  mid/cols and col = mid%cols.
difficulty: medium
pattern: binary-search
challenge:
  id: js-interview-search-2d-matrix-001
  revision: 1
  language: javascript
  title: Search a 2D Matrix
  level: 11
  difficultyScore: 55
  instruction: |
    You are given an m x n matrix where:
    - Each row is sorted ascending left to right
    - The first integer of each row is greater than the last integer of the
      previous row

    Given target, return true if target is in matrix.

    Treat it as one sorted list of length m*n. Binary search mid in [0, m*n).
    Map mid -> (row, col) with:
      row = Math.floor(mid / n)
      col = mid % n

    Examples: matrix=[[1,3,5,7],[10,11,16,20],[23,30,34,60]], target=3 -> true;
    target=13 -> false.

    Complete `searchMatrix(matrix, target)`.
  starterCode: |
    function searchMatrix(matrix, target) {
      // Binary search on flattened index space
    }
  skills: [javascript.algorithms_binary_search, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: searchMatrix}
    - type: functionReturns
      name: searchMatrix
      args:
        - [[1, 3, 5, 7], [10, 11, 16, 20], [23, 30, 34, 60]]
        - 3
      value: true
    - type: functionReturns
      name: searchMatrix
      args:
        - [[1, 3, 5, 7], [10, 11, 16, 20], [23, 30, 34, 60]]
        - 13
      value: false
    - type: functionReturns
      name: searchMatrix
      args:
        - [[1, 3, 5, 7], [10, 11, 16, 20], [23, 30, 34, 60]]
        - 11
      value: true
    - type: functionReturns
      name: searchMatrix
      args:
        - [[1]]
        - 1
      value: true
  hints:
    - level: 1
      message: >-
        Let m = matrix.length, n = matrix[0].length. left=0, right=m*n-1.
    - level: 2
      message: >-
        mid = floor((left+right)/2); value = matrix[floor(mid/n)][mid%n].
    - level: 3
      message: >-
        Compare value to target and shrink left/right like classic binary search.
    - level: 4
      message: |
        function searchMatrix(matrix, target) {
          const m = matrix.length;
          const n = matrix[0].length;
          let left = 0;
          let right = m * n - 1;
          while (left <= right) {
            const mid = Math.floor((left + right) / 2);
            const value = matrix[Math.floor(mid / n)][mid % n];
            if (value === target) return true;
            if (value < target) left = mid + 1;
            else right = mid - 1;
          }
          return false;
        }
  reward: {xp: 50}
  requiresRun: false
  runtime: &workerRuntime
    environment: worker
    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function searchMatrix(matrix, target) {
        const m = matrix.length;
        const n = matrix[0].length;
        let left = 0;
        let right = m * n - 1;
        while (left <= right) {
          const mid = Math.floor((left + right) / 2);
          const value = matrix[Math.floor(mid / n)][mid % n];
          if (value === target) return true;
          if (value < target) left = mid + 1;
          else right = mid - 1;
        }
        return false;
      }
    acceptedSolutions:
      - name: row then column search
        source: |
          function searchMatrix(matrix, target) {
            let top = 0;
            let bottom = matrix.length - 1;
            while (top <= bottom) {
              const mid = Math.floor((top + bottom) / 2);
              const row = matrix[mid];
              if (target < row[0]) bottom = mid - 1;
              else if (target > row[row.length - 1]) top = mid + 1;
              else {
                let left = 0;
                let right = row.length - 1;
                while (left <= right) {
                  const j = Math.floor((left + right) / 2);
                  if (row[j] === target) return true;
                  if (row[j] < target) left = j + 1;
                  else right = j - 1;
                }
                return false;
              }
            }
            return false;
          }
    rejectedSolutions:
      - name: only checks first row
        source: |
          function searchMatrix(matrix, target) {
            return matrix[0].includes(target);
          }
