    acceptedSolutions:
      - name: copy then sink
        source: |
          function numIslands(grid) {
            const g = grid.map((row) => row.slice());
            const rows = g.length;
            const cols = g[0].length;
            function sink(r, c) {
              if (r < 0 || c < 0 || r >= rows || c >= cols || g[r][c] !== "1") return;
              g[r][c] = "0";
              sink(r + 1, c);
              sink(r - 1, c);
              sink(r, c + 1);
              sink(r, c - 1);
            }
            let count = 0;
            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                if (g[r][c] === "1") {
                  count += 1;
                  sink(r, c);
                }
              }
            }
            return count;
          }
    rejectedSolutions:
      - name: counts land cells
        source: |
          function numIslands(grid) {
            let count = 0;
            for (const row of grid) {
              for (const cell of row) {
                if (cell === "1") count += 1;
              }
            }
            return count;
          }
