  hints:
    - level: 1
      message: >-
        If source === destination, return 0. Otherwise build graph[a].push(b) both ways.
    - level: 2
      message: >-
        Queue pairs [node, dist]. Mark visited when enqueued so each node is processed once.
    - level: 3
      message: >-
        When you dequeue destination, return dist. If the queue empties, return -1.
    - level: 4
      message: |
        function shortestPathLength(n, edges, source, destination) {
          if (source === destination) return 0;
          const graph = Array.from({ length: n }, () => []);
          for (const [a, b] of edges) {
            graph[a].push(b);
            graph[b].push(a);
          }
          const seen = new Array(n).fill(false);
          seen[source] = true;
          const queue = [[source, 0]];
          for (let i = 0; i < queue.length; i++) {
            const [node, dist] = queue[i];
            for (const next of graph[node]) {
              if (seen[next]) continue;
              if (next === destination) return dist + 1;
              seen[next] = true;
              queue.push([next, dist + 1]);
            }
          }
          return -1;
        }
