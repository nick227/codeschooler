    acceptedSolutions:
      - name: level-order BFS
        source: |
          function shortestPathLength(n, edges, source, destination) {
            if (source === destination) return 0;
            const graph = Array.from({ length: n }, () => []);
            for (const [a, b] of edges) {
              graph[a].push(b);
              graph[b].push(a);
            }
            const seen = new Set([source]);
            let frontier = [source];
            let dist = 0;
            while (frontier.length) {
              const nextFrontier = [];
              dist += 1;
              for (const node of frontier) {
                for (const next of graph[node]) {
                  if (seen.has(next)) continue;
                  if (next === destination) return dist;
                  seen.add(next);
                  nextFrontier.push(next);
                }
              }
              frontier = nextFrontier;
            }
            return -1;
          }
    rejectedSolutions:
      - name: first DFS path length
        source: |
          function shortestPathLength(n, edges, source, destination) {
            if (source === destination) return 0;
            const graph = Array.from({ length: n }, () => []);
            for (const [a, b] of edges) {
              graph[a].push(b);
              graph[b].push(a);
            }
            const seen = new Set();
            function dfs(node, dist) {
              if (node === destination) return dist;
              seen.add(node);
              for (const next of graph[node]) {
                if (seen.has(next)) continue;
                const found = dfs(next, dist + 1);
                if (found !== -1) return found;
              }
              seen.delete(node);
              return -1;
            }
            return dfs(source, 0);
          }
