title: Shortest Path Length in Unweighted Graph
summary: >-
  Easy shortest-path intro — BFS layer distance on an undirected unweighted
  graph, returning edge count or -1.
difficulty: easy
pattern: shortest-path
progression: intro
challenge:
  id: js-interview-shortest-path-length-001
  revision: 1
  language: javascript
  title: Shortest Path Length in Unweighted Graph
  level: 10
  difficultyScore: 40
  tags: [confidence-builder]
  instruction: |
    There is an undirected unweighted graph with n vertices labeled 0..n-1.
    edges[i] = [ui, vi] is a bi-directional edge. Return the length of the
    shortest path from source to destination (number of edges), or -1 if none.
    If source === destination, return 0.

    Shortest-path intro model (unweighted):
    1. Build an adjacency list
    2. BFS from source, tracking distance (or expanding level by level)
    3. The first time you reach destination, that distance is shortest
    4. If the queue empties first, return -1

    Why BFS, not DFS:
    In an unweighted graph, the first time BFS reaches a node is via a minimum
    edge count. DFS may find a longer path first.

    Examples:
    - n=3, edges=[[0,1],[1,2]], source=0, destination=2 -> 2
    - n=6, edges=[[0,1],[0,2],[3,5],[5,4],[4,3]], source=0, destination=5 -> -1
    - n=1, edges=[], source=0, destination=0 -> 0

    Complete `shortestPathLength(n, edges, source, destination)`.
  starterCode: |
