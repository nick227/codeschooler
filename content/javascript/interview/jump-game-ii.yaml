    acceptedSolutions:
      - name: BFS layers
        source: |
          function jump(nums) {
            if (nums.length <= 1) return 0;
            let jumps = 0;
            let left = 0;
            let right = 0;
            while (right < nums.length - 1) {
              let farthest = 0;
              for (let i = left; i <= right; i++) farthest = Math.max(farthest, i + nums[i]);
              left = right + 1;
              right = farthest;
              jumps += 1;
            }
            return jumps;
          }
    rejectedSolutions:
      - name: always jump max from zero
        source: |
          function jump(nums) {
            if (nums.length <= 1) return 0;
            return 1;
          }
