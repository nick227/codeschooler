        source: |
          function cloneGraph(node) {
            if (!node) return null;
            const map = new Map();
            const queue = [node];
            map.set(node, { val: node.val, neighbors: [] });
            while (queue.length) {
              const cur = queue.shift();
              const clone = map.get(cur);
              for (const neighbor of cur.neighbors) {
                if (!map.has(neighbor)) {
                  map.set(neighbor, { val: neighbor.val, neighbors: [] });
                  queue.push(neighbor);
                }
                clone.neighbors.push(map.get(neighbor));
