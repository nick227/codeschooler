  level: 11
  difficultyScore: 45
  tags: [interview, trees, recursion, dfs]
  instruction: >-
    Nodes are `{ val, left, right }`. Complete `maxDepth(root)` so it returns
    the number of nodes along the longest root-to-leaf path. Keep `demoDepth()`
    as written.
  starterCode: |
    function maxDepth(root) {
      // Return tree height in nodes
    }

    function demoDepth() {
      const root = {
        val: 1,
        left: { val: 2, left: null, right: null },
        right: {
          val: 3,
          left: null,
          right: { val: 4, left: null, right: null },
        },
      };
      return maxDepth(root);
    }
  skills: [javascript.binary_trees, javascript.algorithms_dfs, javascript.algorithms_recursion]
  guidance: independent
  checks:
    - {type: functionExists, name: maxDepth}
    - {type: functionExists, name: demoDepth}
    - {type: functionReturns, name: demoDepth, args: [], value: 3}
    - {type: functionReturns, name: maxDepth, args: [null], value: 0}
  hints:
    - level: 1
      message: An empty tree has depth 0.
    - level: 2
      message: Depth is 1 plus the larger of the left and right depths.
    - level: 3
      message: "return 1 + Math.max(maxDepth(root.left), maxDepth(root.right));"
    - level: 4
      message: |
        function maxDepth(root) {
          if (!root) return 0;
          return 1 + Math.max(maxDepth(root.left), maxDepth(root.right));
        }

        function demoDepth() {
          const root = {
            val: 1,
            left: { val: 2, left: null, right: null },
            right: {
              val: 3,
              left: null,
              right: { val: 4, left: null, right: null },
            },
          };
          return maxDepth(root);
