  authoring:
    referenceSolution: |
      function maxDepth(root) {
        if (!root) return 0;
        return 1 + Math.max(maxDepth(root.left), maxDepth(root.right));
      }

      function demoDepth() {
        const root = {
          val: 1,
          left: { val: 2, left: null, right: null },
          right: {
            val: 3,
            left: null,
            right: { val: 4, left: null, right: null },
          },
        };
        return maxDepth(root);
      }
    acceptedSolutions:
      - name: explicit left right locals
        source: |
          function maxDepth(root) {
            if (root === null) return 0;
            const left = maxDepth(root.left);
            const right = maxDepth(root.right);
            return 1 + (left > right ? left : right);
          }

          function demoDepth() {
            const root = {
              val: 1,
              left: { val: 2, left: null, right: null },
              right: {
                val: 3,
                left: null,
                right: { val: 4, left: null, right: null },
              },
            };
            return maxDepth(root);
          }
    rejectedSolutions:
      - name: counts only left
        source: |
          function maxDepth(root) {
            if (!root) return 0;
            return 1 + maxDepth(root.left);
          }

          function demoDepth() {
            const root = {
              val: 1,
              left: { val: 2, left: null, right: null },
              right: {
                val: 3,
                left: null,
                right: { val: 4, left: null, right: null },
              },
            };
            return maxDepth(root);
          }
