      }
    acceptedSolutions:
      - name: string accumulation
        source: |
          function letterCombinations(digits) {
            if (!digits.length) return [];
            const map = {
              "2": "abc", "3": "def", "4": "ghi", "5": "jkl",
              "6": "mno", "7": "pqrs", "8": "tuv", "9": "wxyz",
            };
            const result = [];
            function walk(i, path) {
              if (i === digits.length) {
                result.push(path);
                return;
              }
              for (const ch of map[digits[i]]) walk(i + 1, path + ch);
            }
            walk(0, "");
            return result;
          }

          function sortedLetterCombinations(digits) {
            return letterCombinations(digits).slice().sort();
          }
    rejectedSolutions:
      - name: only first letter per digit
        source: |
          function letterCombinations(digits) {
            if (!digits.length) return [];
            const map = {
              "2": "abc", "3": "def", "4": "ghi", "5": "jkl",
              "6": "mno", "7": "pqrs", "8": "tuv", "9": "wxyz",
            };
            let out = "";
            for (const d of digits) out += map[d][0];
            return [out];
          }

          function sortedLetterCombinations(digits) {
            return letterCombinations(digits).slice().sort();
          }
