id: js-interview-rotate-image
revision: 1
title: Rotate Image
summary: >-
  Rotate an n×n matrix 90° clockwise in place — transpose, then reverse each
  row (or layer-by-layer swaps).
difficulty: medium
pattern: matrices
challenge:
  id: js-interview-rotate-image-001
  revision: 1
  language: javascript
  title: Rotate Image
  level: 11
  difficultyScore: 55
  instruction: |
    Given an n x n matrix representing an image, rotate it 90 degrees clockwise
    in place. Return the same matrix object after rotation (mutations are OK).

    Mapping insight:
      (r, c) -> (c, n - 1 - r)

    Clean two-pass method:
    1. Transpose: swap matrix[r][c] with matrix[c][r] for c > r
    2. Reverse each row

    Why interviews like it:
    It checks index discipline without heavy algorithms. Off-by-one errors in
    the reverse step are common.

    Example:
      [[1,2,3],[4,5,6],[7,8,9]] -> [[7,4,1],[8,5,2],[9,6,3]]

    Complete `rotate(matrix)`.
  starterCode: |
    function rotate(matrix) {
      // Transpose, then reverse each row; return matrix
    }
  skills: [javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: rotate}
    - {type: functionReturns, name: rotate, args: [[[1, 2, 3], [4, 5, 6], [7, 8, 9]]], value: [[7, 4, 1], [8, 5, 2], [9, 6, 3]]}
    - {type: functionReturns, name: rotate, args: [[[5, 1, 9, 11], [2, 4, 8, 10], [13, 3, 6, 7], [15, 14, 12, 16]]], value: [[15, 13, 2, 5], [14, 3, 4, 1], [12, 6, 8, 9], [16, 7, 10, 11]]}
    - {type: functionReturns, name: rotate, args: [[[1]]], value: [[1]]}
  hints:
    - level: 1
      message: >-
        Let n = matrix.length. First transpose along the main diagonal.
    - level: 2
      message: >-
        For r in 0..n-1 and c in r+1..n-1, swap matrix[r][c] and matrix[c][r].
    - level: 3
      message: >-
        Then for each row, reverse it in place (two pointers or Array.reverse).
    - level: 4
      message: |
        function rotate(matrix) {
          const n = matrix.length;
          for (let r = 0; r < n; r++) {
            for (let c = r + 1; c < n; c++) {
              const tmp = matrix[r][c];
              matrix[r][c] = matrix[c][r];
              matrix[c][r] = tmp;
            }
          }
          for (const row of matrix) row.reverse();
          return matrix;
        }
  reward: {xp: 50}
  requiresRun: false
  runtime: &workerRuntime
    environment: worker
    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function rotate(matrix) {
        const n = matrix.length;
        for (let r = 0; r < n; r++) {
          for (let c = r + 1; c < n; c++) {
            const tmp = matrix[r][c];
            matrix[r][c] = matrix[c][r];
            matrix[c][r] = tmp;
          }
        }
        for (const row of matrix) row.reverse();
        return matrix;
      }
    acceptedSolutions:
      - name: layer cycles
        source: |
          function rotate(matrix) {
            const n = matrix.length;
            for (let layer = 0; layer < Math.floor(n / 2); layer++) {
              const first = layer;
              const last = n - 1 - layer;
              for (let i = first; i < last; i++) {
                const offset = i - first;
                const top = matrix[first][i];
                matrix[first][i] = matrix[last - offset][first];
                matrix[last - offset][first] = matrix[last][last - offset];
                matrix[last][last - offset] = matrix[i][last];
                matrix[i][last] = top;
              }
            }
            return matrix;
          }
    rejectedSolutions:
      - name: transpose only
        source: |
          function rotate(matrix) {
            const n = matrix.length;
            for (let r = 0; r < n; r++) {
              for (let c = r + 1; c < n; c++) {
                const tmp = matrix[r][c];
                matrix[r][c] = matrix[c][r];
                matrix[c][r] = tmp;
              }
            }
            return matrix;
          }
