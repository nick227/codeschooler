  authoring:
    referenceSolution: |
      function reverseList(head) {
        let prev = null;
        let cur = head;
        while (cur) {
          const next = cur.next;
          cur.next = prev;
          prev = cur;
          cur = next;
        }
        return prev;
      }

      function demoReverse() {
        const c = { val: 3, next: null };
        const b = { val: 2, next: c };
        const a = { val: 1, next: b };
        let cur = reverseList(a);
        const out = [];
        while (cur) {
          out.push(cur.val);
          cur = cur.next;
        }
        return out;
      }
    acceptedSolutions:
      - name: recursive reverse
        source: |
          function reverseList(head) {
            if (!head || !head.next) return head;
            const newHead = reverseList(head.next);
            head.next.next = head;
            head.next = null;
            return newHead;
          }

          function demoReverse() {
            const c = { val: 3, next: null };
            const b = { val: 2, next: c };
            const a = { val: 1, next: b };
            let cur = reverseList(a);
            const out = [];
            while (cur) {
              out.push(cur.val);
              cur = cur.next;
            }
            return out;
          }
    rejectedSolutions:
      - name: returns original order
        source: |
          function reverseList(head) {
            return head;
          }

          function demoReverse() {
            const c = { val: 3, next: null };
            const b = { val: 2, next: c };
            const a = { val: 1, next: b };
            let cur = reverseList(a);
            const out = [];
            while (cur) {
              out.push(cur.val);
              cur = cur.next;
            }
            return out;
          }
