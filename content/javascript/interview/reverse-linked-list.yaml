challenge:
  id: js-interview-reverse-linked-list-001
  revision: 1
  language: javascript
  title: Reverse Linked List
  level: 11
  difficultyScore: 55
  instruction: >-
    Nodes are plain objects `{ val, next }`. Complete `reverseList(head)` so it
    returns the new head of the reversed list. Keep `demoReverse()` as written.
  starterCode: |
    function reverseList(head) {
      // Rewire next pointers iteratively
    }

    function demoReverse() {
      const c = { val: 3, next: null };
      const b = { val: 2, next: c };
      const a = { val: 1, next: b };
      let cur = reverseList(a);
      const out = [];
      while (cur) {
        out.push(cur.val);
        cur = cur.next;
      }
      return out;
    }
