id: js-interview-binary-search
revision: 1
title: Binary Search
summary: Find a target in a sorted array in O(log N) time.
difficulty: easy
pattern: binary-search
challenge:
  id: js-interview-binary-search-001
  revision: 1
  language: javascript
  title: Binary Search
  level: 10
  difficultyScore: 45
  tags: [interview, binary-search, arrays]
  instruction: >-
    Complete `binarySearch(nums, target)` for a sorted ascending array. Return
    the index of `target`, or `-1` if absent. Use binary search, not a linear scan.
  starterCode: |
    function binarySearch(nums, target) {
      // Classic binary search
    }
  skills: [javascript.algorithms_binary_search, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: binarySearch}
    - {type: functionReturns, name: binarySearch, args: [[-1, 0, 3, 5, 9, 12], 9], value: 4}
    - {type: functionReturns, name: binarySearch, args: [[-1, 0, 3, 5, 9, 12], 2], value: -1}
    - {type: functionReturns, name: binarySearch, args: [[5], 5], value: 0}
  hints:
    - level: 1
      message: Keep left and right bounds around the remaining search space.
    - level: 2
      message: Compare the midpoint value to target and discard half.
    - level: 3
      message: Loop while left <= right.
    - level: 4
      message: |
        function binarySearch(nums, target) {
          let left = 0;
          let right = nums.length - 1;
          while (left <= right) {
            const mid = Math.floor((left + right) / 2);
            if (nums[mid] === target) return mid;
            if (nums[mid] < target) left = mid + 1;
            else right = mid - 1;
          }
          return -1;
        }
  reward: {xp: 45}
  requiresRun: false
  runtime: &workerRuntime
    environment: worker
    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function binarySearch(nums, target) {
        let left = 0;
        let right = nums.length - 1;
        while (left <= right) {
          const mid = Math.floor((left + right) / 2);
          if (nums[mid] === target) return mid;
          if (nums[mid] < target) left = mid + 1;
          else right = mid - 1;
        }
        return -1;
      }
    acceptedSolutions:
      - name: bit shift mid
        source: |
          function binarySearch(nums, target) {
            let left = 0;
            let right = nums.length - 1;
            while (left <= right) {
              const mid = (left + right) >> 1;
              if (nums[mid] === target) return mid;
              if (nums[mid] < target) left = mid + 1;
              else right = mid - 1;
            }
            return -1;
          }
    rejectedSolutions:
      - name: always -1
        source: |
          function binarySearch(nums, target) {
            return -1;
          }
