    acceptedSolutions:
      - name: BFS flood fill
        source: |
          function countComponents(n, edges) {
            const graph = Array.from({ length: n }, () => []);
            for (const [a, b] of edges) {
              graph[a].push(b);
              graph[b].push(a);
            }
            const seen = new Array(n).fill(false);
            let count = 0;
            for (let i = 0; i < n; i++) {
              if (seen[i]) continue;
              count += 1;
              const queue = [i];
              seen[i] = true;
              while (queue.length) {
                const node = queue.shift();
                for (const next of graph[node]) {
                  if (!seen[next]) {
                    seen[next] = true;
                    queue.push(next);
                  }
                }
              }
            }
            return count;
          }
    rejectedSolutions:
      - name: returns node count
        source: |
          function countComponents(n, edges) {
            return n;
          }
