    - {type: functionReturns, name: countComponents, args: [3, [[0, 1], [1, 2]]], value: 1}
    - {type: functionReturns, name: countComponents, args: [3, []], value: 3}
  hints:
    - level: 1
      message: Build an adjacency list from the undirected edges.
    - level: 2
      message: Each time you find an unvisited node, start a DFS and increment the count.
    - level: 3
      message: Mark nodes visited so you do not recount the same component.
    - level: 4
      message: |
        function countComponents(n, edges) {
          const graph = Array.from({ length: n }, () => []);
          for (const [a, b] of edges) {
            graph[a].push(b);
            graph[b].push(a);
          }
          const seen = new Array(n).fill(false);
          function dfs(node) {
            seen[node] = true;
            for (const next of graph[node]) {
              if (!seen[next]) dfs(next);
            }
          }
          let count = 0;
          for (let i = 0; i < n; i++) {
            if (!seen[i]) {
              count += 1;
              dfs(i);
            }
          }
          return count;
        }
