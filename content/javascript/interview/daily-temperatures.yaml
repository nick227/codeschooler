    acceptedSolutions:
      - name: nested scan
        source: |
          function dailyTemperatures(temps) {
            const answer = [];
            for (let i = 0; i < temps.length; i++) {
              let wait = 0;
              for (let j = i + 1; j < temps.length; j++) {
                if (temps[j] > temps[i]) {
                  wait = j - i;
                  break;
                }
              }
              answer.push(wait);
            }
            return answer;
          }
    rejectedSolutions:
      - name: all zeros
        source: |
          function dailyTemperatures(temps) {
            return temps.map(() => 0);
          }
