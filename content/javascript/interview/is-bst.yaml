id: js-interview-is-bst
revision: 1
title: Validate Binary Search Tree
summary: Decide whether a binary tree obeys BST ordering with recursive bounds.
difficulty: medium
pattern: binary-trees
challenge:
  id: js-interview-is-bst-001
  revision: 1
  language: javascript
  title: Validate BST
  level: 11
  difficultyScore: 60
  instruction: >-
    Complete `isValidBST(root)` so it returns `true` when every node value is
    strictly greater than all values in its left subtree and strictly less than
    all values in its right subtree. Keep `demoBst()` as written.
  starterCode: |
    function isValidBST(root) {
      // Recurse with low/high bounds
    }

    function demoBst() {
      const good = {
        val: 2,
        left: { val: 1, left: null, right: null },
        right: { val: 3, left: null, right: null },
      };
      const bad = {
        val: 5,
        left: { val: 1, left: null, right: null },
        right: {
          val: 6,
          left: { val: 4, left: null, right: null },
          right: { val: 7, left: null, right: null },
        },
      };
      return [isValidBST(good), isValidBST(bad), isValidBST(null)];
    }
  skills: [javascript.binary_trees, javascript.algorithms_recursion, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: isValidBST}
    - {type: functionExists, name: demoBst}
    - {type: functionReturns, name: demoBst, args: [], value: [true, false, true]}
  hints:
    - level: 1
      message: Pass allowed (low, high) bounds down the recursion.
    - level: 2
      message: Reject when node.val is outside (low, high).
    - level: 3
      message: Left child must be < node.val; right child must be > node.val.
    - level: 4
      message: |
        function isValidBST(root) {
          function valid(node, low, high) {
            if (!node) return true;
            if (node.val <= low || node.val >= high) return false;
            return valid(node.left, low, node.val) && valid(node.right, node.val, high);
          }
          return valid(root, -Infinity, Infinity);
        }

        function demoBst() {
          const good = {
            val: 2,
            left: { val: 1, left: null, right: null },
            right: { val: 3, left: null, right: null },
          };
          const bad = {
            val: 5,
            left: { val: 1, left: null, right: null },
            right: {
              val: 6,
              left: { val: 4, left: null, right: null },
              right: { val: 7, left: null, right: null },
            },
          };
          return [isValidBST(good), isValidBST(bad), isValidBST(null)];
        }
