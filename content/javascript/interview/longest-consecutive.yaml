  authoring:
    referenceSolution: |
      function longestConsecutive(nums) {
        const set = new Set(nums);
        let best = 0;
        for (const n of set) {
          if (set.has(n - 1)) continue;
          let length = 1;
          let cur = n;
          while (set.has(cur + 1)) {
            cur += 1;
            length += 1;
          }
          best = Math.max(best, length);
        }
        return best;
      }
    acceptedSolutions:
      - name: sort and scan
        source: |
          function longestConsecutive(nums) {
            if (nums.length === 0) return 0;
            const sorted = [...new Set(nums)].sort((a, b) => a - b);
            let best = 1;
            let cur = 1;
            for (let i = 1; i < sorted.length; i++) {
              if (sorted[i] === sorted[i - 1] + 1) {
                cur += 1;
                best = Math.max(best, cur);
              } else {
                cur = 1;
              }
            }
            return best;
          }
    rejectedSolutions:
      - name: returns length
        source: |
          function longestConsecutive(nums) {
            return nums.length;
          }
