id: js-interview-longest-consecutive
revision: 1
title: Longest Consecutive Sequence
summary: >-
  Use a Set so you only start counting when a number has no predecessor —
  turning O(N log N) sort into expected O(N).
difficulty: medium
pattern: hash-maps
challenge:
  id: js-interview-longest-consecutive-001
  revision: 1
  language: javascript
  title: Longest Consecutive Sequence
  level: 11
  difficultyScore: 60
  tags: [interview, hash-set, arrays]
  instruction: |
    Given an unsorted array of integers, return the length of the longest
    consecutive elements sequence.

    Example: [100, 4, 200, 1, 3, 2] -> 4 because 1,2,3,4 is consecutive.

    Why this problem teaches work reduction:
    Sorting then scanning is O(N log N). Interviewers want O(N) expected time:
    put every number in a Set, then only begin a streak when `n - 1` is absent.
    That guarantees each number is visited a constant number of times.

    Mental model:
    - Numbers that are mid-streak are "followers" — skip starting there
    - Numbers with no left neighbor are streak starts — walk n+1, n+2, ...

    Complete `longestConsecutive(nums)`.
  starterCode: |
    function longestConsecutive(nums) {
      // Set + only start streaks at numbers without n-1
    }
  skills: [javascript.sets, javascript.algorithms_hash_maps, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: longestConsecutive}
    - {type: functionReturns, name: longestConsecutive, args: [[100, 4, 200, 1, 3, 2]], value: 4}
    - {type: functionReturns, name: longestConsecutive, args: [[0, 3, 7, 2, 5, 8, 4, 6, 0, 1]], value: 9}
    - {type: functionReturns, name: longestConsecutive, args: [[]], value: 0}
  hints:
    - level: 1
      message: >-
        Build const set = new Set(nums). Track a best length integer.
    - level: 2
      message: >-
        For each n in set, if set does not contain n - 1, you found a streak start.
    - level: 3
      message: >-
        From that start, count while set.has(cur + 1). Update best with the streak length.
    - level: 4
      message: |
        function longestConsecutive(nums) {
          const set = new Set(nums);
          let best = 0;
          for (const n of set) {
            if (set.has(n - 1)) continue;
            let length = 1;
            let cur = n;
            while (set.has(cur + 1)) {
              cur += 1;
              length += 1;
            }
            best = Math.max(best, length);
          }
          return best;
        }
