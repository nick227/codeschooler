  authoring:
    referenceSolution: |
      function twoSum(nums, target) {
        const seen = new Map();
        for (let i = 0; i < nums.length; i++) {
          const need = target - nums[i];
          if (seen.has(need)) return [seen.get(need), i];
          seen.set(nums[i], i);
        }
      }
    acceptedSolutions:
      - name: object lookup
        source: |
          function twoSum(nums, target) {
            const seen = Object.create(null);
            for (let i = 0; i < nums.length; i++) {
              const need = target - nums[i];
              if (seen[need] !== undefined) return [seen[need], i];
              seen[nums[i]] = i;
            }
          }
    rejectedSolutions:
      - name: returns first two indices
        source: |
          function twoSum() {
            return [0, 1];
          }
