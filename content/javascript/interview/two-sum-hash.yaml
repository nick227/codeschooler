id: js-interview-two-sum-hash
revision: 2
title: Two Sum with Hash Map
summary: >-
  Find two indices that add to target in one pass — store seen values in a map
  so each complement lookup is O(1).
difficulty: easy
pattern: hash-maps
challenge:
  id: js-interview-two-sum-hash-001
  revision: 2
  language: javascript
  title: Two Sum
  level: 10
  difficultyScore: 55
  instruction: |
    Given an array of integers nums and an integer target, return the indices of
    the two numbers such that they add up to target. Exactly one solution exists;
    you may not use the same element twice.

    Why this is the canonical hash-map interview:
    Nested loops check every pair in O(N^2). The work-reduction insight is that
    for each nums[i] you only need to know whether target - nums[i] appeared
    earlier — a Map from value -> index answers that in expected O(1).

    One-pass pattern:
    1. For index i, compute need = target - nums[i]
    2. If seen.has(need), return [seen.get(need), i]
    3. Otherwise seen.set(nums[i], i)

    Store after the lookup so you never pair an index with itself.

    Complete `twoSum(nums, target)`.
  starterCode: |
    function twoSum(nums, target) {
      // One-pass Map of value -> index
    }
  skills: [javascript.algorithms_hash_maps, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: twoSum}
    - {type: functionReturns, name: twoSum, args: [[2, 7, 11, 15], 9], value: [0, 1]}
    - {type: functionReturns, name: twoSum, args: [[3, 2, 4], 6], value: [1, 2]}
    - {type: functionReturns, name: twoSum, args: [[3, 3], 6], value: [0, 1]}
  hints:
    - level: 1
      message: >-
        Create const seen = new Map(). Scan left to right with index i.
    - level: 2
      message: >-
        need = target - nums[i]. If seen.has(need), return [seen.get(need), i].
    - level: 3
      message: >-
        Only after the miss: seen.set(nums[i], i). That avoids using i twice.
    - level: 4
      message: |
        function twoSum(nums, target) {
          const seen = new Map();
          for (let i = 0; i < nums.length; i++) {
            const need = target - nums[i];
            if (seen.has(need)) return [seen.get(need), i];
            seen.set(nums[i], i);
          }
        }
