    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function lengthOfLongestSubstring(s) {
        const seen = new Set();
        let left = 0;
        let best = 0;
        for (let right = 0; right < s.length; right++) {
          const ch = s[right];
          while (seen.has(ch)) {
            seen.delete(s[left]);
            left += 1;
          }
          seen.add(ch);
          if (right - left + 1 > best) best = right - left + 1;
        }
        return best;
      }
    acceptedSolutions:
      - name: last-index map
        source: |
          function lengthOfLongestSubstring(s) {
            const last = new Map();
            let left = 0;
            let best = 0;
            for (let right = 0; right < s.length; right++) {
              const ch = s[right];
              if (last.has(ch) && last.get(ch) >= left) left = last.get(ch) + 1;
              last.set(ch, right);
              best = Math.max(best, right - left + 1);
            }
            return best;
          }
    rejectedSolutions:
      - name: returns string length
        source: |
          function lengthOfLongestSubstring(s) {
            return s.length;
          }
