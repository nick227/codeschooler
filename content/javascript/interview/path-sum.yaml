    acceptedSolutions:
      - name: accumulate sum
        source: |
          function hasPathSum(root, target) {
            function dfs(node, sum) {
              if (!node) return false;
              const next = sum + node.val;
              if (!node.left && !node.right) return next === target;
              return dfs(node.left, next) || dfs(node.right, next);
            }
            return dfs(root, 0);
          }

          function demoPath() {
            const root = {
              val: 5,
              left: {
