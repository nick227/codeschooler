              right: {
                val: 8,
                left: { val: 13, left: null, right: null },
                right: { val: 4, left: null, right: { val: 1, left: null, right: null } },
              },
            };
            return [hasPathSum(root, 22), hasPathSum(root, 26), hasPathSum(null, 0)];
          }
