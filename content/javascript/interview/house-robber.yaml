  hints:
    - level: 1
      message: At each house, choose skip (keep prior best) or rob (prior-prior + value).
    - level: 2
      message: Track only the previous two best totals.
    - level: 3
      message: Empty input returns 0.
    - level: 4
      message: |
        function rob(nums) {
          let prev2 = 0;
          let prev1 = 0;
          for (const value of nums) {
            const best = Math.max(prev1, prev2 + value);
            prev2 = prev1;
            prev1 = best;
          }
          return prev1;
        }
