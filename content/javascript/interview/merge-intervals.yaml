challenge:
  id: js-interview-merge-intervals-001
  revision: 1
  language: javascript
  title: Merge Intervals
  level: 10
  difficultyScore: 65
  tags: [interview, intervals, sorting]
  instruction: >-
    Complete `mergeIntervals(intervals)` where each interval is `[start, end]`.
    Return a new array of merged non-overlapping intervals sorted by start.
  starterCode: |
    function mergeIntervals(intervals) {
      // Sort by start, then merge overlaps
    }
  skills: [javascript.algorithms_intervals, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: mergeIntervals}
    - {type: functionReturns, name: mergeIntervals, args: [[[1, 3], [2, 6], [8, 10], [15, 18]]], value: [[1, 6], [8, 10], [15, 18]]}
    - {type: functionReturns, name: mergeIntervals, args: [[[1, 4], [4, 5]]], value: [[1, 5]]}
    - {type: functionReturns, name: mergeIntervals, args: [[[1, 4]]], value: [[1, 4]]}
  hints:
    - level: 1
      message: Sort intervals by their start value first.
    - level: 2
      message: If the next interval starts before or at the current end, extend the end.
    - level: 3
      message: Otherwise push the current interval and start a new one.
    - level: 4
      message: |
        function mergeIntervals(intervals) {
          if (intervals.length === 0) return [];
          const sorted = intervals.slice().sort((a, b) => a[0] - b[0]);
          const merged = [sorted[0].slice()];
          for (let i = 1; i < sorted.length; i++) {
            const last = merged[merged.length - 1];
            const cur = sorted[i];
            if (cur[0] <= last[1]) last[1] = Math.max(last[1], cur[1]);
            else merged.push(cur.slice());
          }
          return merged;
        }
