    referenceSolution: |
      function mergeIntervals(intervals) {
        if (intervals.length === 0) return [];
        const sorted = intervals.slice().sort((a, b) => a[0] - b[0]);
        const merged = [sorted[0].slice()];
        for (let i = 1; i < sorted.length; i++) {
          const last = merged[merged.length - 1];
          const cur = sorted[i];
          if (cur[0] <= last[1]) last[1] = Math.max(last[1], cur[1]);
          else merged.push(cur.slice());
        }
        return merged;
      }
    acceptedSolutions:
      - name: same logic with destructuring
        source: |
          function mergeIntervals(intervals) {
            const sorted = intervals.slice().sort((a, b) => a[0] - b[0]);
            const merged = [];
            for (const [start, end] of sorted) {
              if (!merged.length || start > merged[merged.length - 1][1]) merged.push([start, end]);
              else merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], end);
            }
            return merged;
          }
    rejectedSolutions:
      - name: returns unsorted input
        source: |
          function mergeIntervals(intervals) {
            return intervals.slice();
          }
