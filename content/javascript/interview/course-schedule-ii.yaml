    acceptedSolutions:
      - name: unsorted queue still valid when unique
        source: |
          function findOrder(numCourses, prerequisites) {
            const graph = Array.from({ length: numCourses }, () => []);
            const indegree = new Array(numCourses).fill(0);
            for (const [course, prep] of prerequisites) {
              graph[prep].push(course);
              indegree[course] += 1;
            }
            const ready = [];
            for (let i = 0; i < numCourses; i++) if (indegree[i] === 0) ready.push(i);
            ready.sort((a, b) => a - b);
            const order = [];
            while (ready.length) {
              const node = ready.shift();
              order.push(node);
              const unlocked = [];
              for (const next of graph[node]) {
                indegree[next] -= 1;
                if (indegree[next] === 0) unlocked.push(next);
              }
              ready.push(...unlocked);
              ready.sort((a, b) => a - b);
            }
            return order.length === numCourses ? order : [];
          }
    rejectedSolutions:
      - name: identity order ignores prereqs
        source: |
          function findOrder(numCourses) {
            return Array.from({ length: numCourses }, (_, i) => i);
          }
