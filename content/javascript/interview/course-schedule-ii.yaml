id: js-interview-course-schedule-ii
revision: 1
title: Course Schedule II
summary: >-
  Return one valid course order with Kahn's algorithm — prefer the smallest
  ready course id so the answer is deterministic.
difficulty: medium
pattern: topological-sort
challenge:
  id: js-interview-course-schedule-ii-001
  revision: 1
  language: javascript
  title: Course Schedule II
  level: 11
  difficultyScore: 60
  tags: [interview, graphs, topological-sort]
  instruction: |
    There are numCourses labeled 0..numCourses-1. prerequisites[i] = [course, prep]
    means prep must be taken before course.

    Return any ordering of all courses that respects prerequisites. If it is
    impossible (cycle), return [].

    For grading, when multiple orders are valid, return the lexicographically
    smallest sequence of course ids (always dequeue the smallest indegree-0
    course).

    Companion to Course Schedule (I): there you only ask "possible?"; here you
    emit the actual order.

    Examples:
    - numCourses=2, [[1,0]] -> [0,1]
    - numCourses=4, [[1,0],[2,0],[3,1],[3,2]] -> [0,1,2,3]
    - numCourses=1, [] -> [0]

    Complete `findOrder(numCourses, prerequisites)`.
  starterCode: |
    function findOrder(numCourses, prerequisites) {
      // Kahn topo sort; pop smallest ready course each time
    }
  skills: [javascript.algorithms_topo_sort, javascript.graphs, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: findOrder}
    - {type: functionReturns, name: findOrder, args: [2, [[1, 0]]], value: [0, 1]}
    - {type: functionReturns, name: findOrder, args: [4, [[1, 0], [2, 0], [3, 1], [3, 2]]], value: [0, 1, 2, 3]}
    - {type: functionReturns, name: findOrder, args: [1, []], value: [0]}
    - {type: functionReturns, name: findOrder, args: [2, [[0, 1], [1, 0]]], value: []}
  hints:
    - level: 1
      message: >-
        Build adjacency from prep -> course and an indegree array.
    - level: 2
      message: >-
        Seed a sorted queue/list with every course whose indegree is 0.
    - level: 3
      message: >-
        Always take the smallest ready id, append to order, reduce neighbors, re-insert newly ready ids sorted.
    - level: 4
      message: |
        function findOrder(numCourses, prerequisites) {
          const graph = Array.from({ length: numCourses }, () => []);
          const indegree = new Array(numCourses).fill(0);
          for (const [course, prep] of prerequisites) {
            graph[prep].push(course);
            indegree[course] += 1;
          }
          const ready = [];
          for (let i = 0; i < numCourses; i++) if (indegree[i] === 0) ready.push(i);
          ready.sort((a, b) => a - b);
          const order = [];
          while (ready.length) {
            const node = ready.shift();
            order.push(node);
            for (const next of graph[node]) {
              indegree[next] -= 1;
              if (indegree[next] === 0) {
                ready.push(next);
                ready.sort((a, b) => a - b);
              }
            }
          }
          return order.length === numCourses ? order : [];
        }
