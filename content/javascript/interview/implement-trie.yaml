id: js-interview-implement-trie
revision: 1
title: Implement Trie
summary: >-
  Prefix tree with insert, search, and startsWith — each node holds a children
  map and an end-of-word flag.
difficulty: medium
pattern: design
challenge:
  id: js-interview-implement-trie-001
  revision: 1
  language: javascript
  title: Implement Trie (Prefix Tree)
  level: 11
  difficultyScore: 60
  tags: [interview, trie, design, strings]
  instruction: |
    Implement a trie (prefix tree) supporting:
    - insert(word)
    - search(word) — true only if word was inserted as a full word
    - startsWith(prefix) — true if any inserted word has that prefix

    Node shape: { children: Map or plain object, end: boolean }.

    Why tries show up in interviews:
    They turn repeated prefix checks into O(L) walks instead of scanning a word
    list. search vs startsWith differs only by requiring node.end === true.

    Keep `demoTrie()` as written.

    Complete `createTrie()`.
  starterCode: |
    function createTrie() {
      // Root node with children + end flag; return { insert, search, startsWith }
    }

    function demoTrie() {
      const trie = createTrie();
      trie.insert("apple");
      const a = trie.search("apple");
      const b = trie.search("app");
      const c = trie.startsWith("app");
      trie.insert("app");
      const d = trie.search("app");
      return [a, b, c, d];
    }
  skills: [javascript.maps, javascript.strings, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: createTrie}
    - {type: functionExists, name: demoTrie}
    - {type: functionReturns, name: demoTrie, args: [], value: [true, false, true, true]}
  hints:
    - level: 1
      message: >-
        Root = { children: new Map(), end: false }. insert walks/creates nodes per character.
    - level: 2
      message: >-
        At the last character of insert, set node.end = true.
    - level: 3
      message: >-
        search requires the walk to finish and node.end === true; startsWith only needs the walk to finish.
    - level: 4
      message: |
        function createTrie() {
          const root = { children: new Map(), end: false };
          return {
            insert(word) {
              let node = root;
              for (const ch of word) {
                if (!node.children.has(ch)) node.children.set(ch, { children: new Map(), end: false });
                node = node.children.get(ch);
              }
              node.end = true;
            },
            search(word) {
              let node = root;
              for (const ch of word) {
                if (!node.children.has(ch)) return false;
                node = node.children.get(ch);
              }
              return node.end;
            },
            startsWith(prefix) {
              let node = root;
              for (const ch of prefix) {
                if (!node.children.has(ch)) return false;
                node = node.children.get(ch);
              }
              return true;
            },
          };
        }

        function demoTrie() {
          const trie = createTrie();
          trie.insert("apple");
          const a = trie.search("apple");
          const b = trie.search("app");
          const c = trie.startsWith("app");
          trie.insert("app");
          const d = trie.search("app");
          return [a, b, c, d];
        }
