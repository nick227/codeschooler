    acceptedSolutions:
      - name: object children
        source: |
          function createTrie() {
            const root = { children: {}, end: false };
            return {
              insert(word) {
                let node = root;
                for (const ch of word) {
                  if (!node.children[ch]) node.children[ch] = { children: {}, end: false };
                  node = node.children[ch];
                }
                node.end = true;
              },
              search(word) {
                let node = root;
                for (const ch of word) {
                  if (!node.children[ch]) return false;
                  node = node.children[ch];
                }
                return node.end;
              },
              startsWith(prefix) {
                let node = root;
                for (const ch of prefix) {
                  if (!node.children[ch]) return false;
                  node = node.children[ch];
                }
                return true;
              },
            };
          }

          function demoTrie() {
            const trie = createTrie();
            trie.insert("apple");
            const a = trie.search("apple");
            const b = trie.search("app");
            const c = trie.startsWith("app");
            trie.insert("app");
            const d = trie.search("app");
            return [a, b, c, d];
          }
    rejectedSolutions:
      - name: search equals startsWith
        source: |
          function createTrie() {
            const words = new Set();
            return {
              insert(word) {
                words.add(word);
              },
              search(word) {
                for (const w of words) if (w.startsWith(word)) return true;
                return false;
              },
              startsWith(prefix) {
                for (const w of words) if (w.startsWith(prefix)) return true;
                return false;
              },
            };
          }

          function demoTrie() {
            const trie = createTrie();
            trie.insert("apple");
            const a = trie.search("apple");
            const b = trie.search("app");
            const c = trie.startsWith("app");
            trie.insert("app");
            const d = trie.search("app");
            return [a, b, c, d];
          }
