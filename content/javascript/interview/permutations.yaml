      function permute(nums) {
        const result = [];
        const used = new Array(nums.length).fill(false);
        function walk(path) {
          if (path.length === nums.length) {
            result.push(path.slice());
            return;
          }
          for (let i = 0; i < nums.length; i++) {
            if (used[i]) continue;
            used[i] = true;
            path.push(nums[i]);
            walk(path);
            path.pop();
            used[i] = false;
          }
        }
        walk([]);
