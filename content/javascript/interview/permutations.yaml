    acceptedSolutions:
      - name: swap-based
        source: |
          function permute(nums) {
            const result = [];
            function walk(start) {
              if (start === nums.length) {
                result.push(nums.slice());
                return;
              }
              for (let i = start; i < nums.length; i++) {
                [nums[start], nums[i]] = [nums[i], nums[start]];
                walk(start + 1);
                [nums[start], nums[i]] = [nums[i], nums[start]];
              }
            }
            walk(0);
            return result;
          }

          function sortedPerms(nums) {
            return permute(nums.slice())
              .map((row) => row.slice())
              .sort((a, b) => a.join(",").localeCompare(b.join(",")));
          }
    rejectedSolutions:
      - name: only identity
        source: |
          function permute(nums) {
            return [nums.slice()];
          }

          function sortedPerms(nums) {
            return permute(nums)
              .map((row) => row.slice())
              .sort((a, b) => a.join(",").localeCompare(b.join(",")));
          }
