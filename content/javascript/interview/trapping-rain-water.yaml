id: js-interview-trapping-rain-water
revision: 1
title: Trapping Rain Water
summary: >-
  Two-pointer water trapping — at each step fill against the shorter side’s known
  max wall, advancing that pointer while accumulating units.
difficulty: hard
pattern: two-pointers
challenge:
  id: js-interview-trapping-rain-water-001
  revision: 1
  language: javascript
  title: Trapping Rain Water
  level: 12
  difficultyScore: 75
  instruction: |
    Given height[], an elevation map where the width of each bar is 1, compute
    how much water it can trap after raining.

    Water above index i is bounded by the tallest bar strictly to the left and
    the tallest bar strictly to the right:
      trapped[i] = max(0, min(leftMax[i], rightMax[i]) - height[i])

    Brute / prefix approach:
    Precompute leftMax and rightMax arrays, then sum the formula — O(N) time,
    O(N) space. That is correct and interview-acceptable.

    Optimal insight (two pointers, O(1) space):
    Maintain left, right, leftMax, rightMax.
    The side with the smaller max is the limiting wall for that pointer’s cell.
    Advance the limiting side, adding water when the current bar is below that
    side’s running max.

    Examples:
    - [0,1,0,2,1,0,1,3,2,1,2,1] -> 6
    - [4,2,0,3,2,5] -> 9

    Complete `trap(height)`.
  starterCode: |
    function trap(height) {
      // Two pointers or leftMax/rightMax arrays
    }
  skills: [javascript.algorithms_two_pointers, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: trap}
    - {type: functionReturns, name: trap, args: [[0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]], value: 6}
    - {type: functionReturns, name: trap, args: [[4, 2, 0, 3, 2, 5]], value: 9}
    - {type: functionReturns, name: trap, args: [[1, 2, 3]], value: 0}
    - {type: functionReturns, name: trap, args: [[]], value: 0}
  hints:
    - level: 1
      message: >-
        For each index, water = min(tallest left, tallest right) - height[i], floored at 0.
    - level: 2
      message: >-
        Two-pointer version: while left < right, if height[left] < height[right] process left (update leftMax, add water, left++), else process right symmetrically.
    - level: 3
      message: >-
        Only add water after leftMax/rightMax is known for that side — when height[left] >= leftMax, just raise leftMax.
    - level: 4
      message: |
        function trap(height) {
          let left = 0;
          let right = height.length - 1;
          let leftMax = 0;
          let rightMax = 0;
          let water = 0;
          while (left < right) {
            if (height[left] < height[right]) {
              if (height[left] >= leftMax) leftMax = height[left];
              else water += leftMax - height[left];
              left += 1;
            } else {
              if (height[right] >= rightMax) rightMax = height[right];
              else water += rightMax - height[right];
              right -= 1;
            }
          }
          return water;
        }
