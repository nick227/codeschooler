id: js-interview-running-sum
revision: 1
title: Running Sum
summary: Build a prefix-sum array where each index stores the sum so far.
difficulty: easy
pattern: prefix-sums
challenge:
  id: js-interview-running-sum-001
  revision: 1
  language: javascript
  title: Running Sum of 1D Array
  level: 10
  difficultyScore: 35
  tags: [interview, prefix-sums, arrays]
  instruction: >-
    Complete `runningSum(nums)` so it returns a new array `out` where
    `out[i]` is the sum of `nums[0] + ... + nums[i]`.
  starterCode: |
    function runningSum(nums) {
      // Build prefix sums
    }
  skills: [javascript.algorithms_prefix_sums, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: runningSum}
    - {type: functionReturns, name: runningSum, args: [[1, 2, 3, 4]], value: [1, 3, 6, 10]}
    - {type: functionReturns, name: runningSum, args: [[1]], value: [1]}
    - {type: functionReturns, name: runningSum, args: [[3, 1, 2]], value: [3, 4, 6]}
  hints:
    - level: 1
      message: Keep a running total as you walk left to right.
    - level: 2
      message: Each output value is previous total plus the current number.
    - level: 3
      message: "total += nums[i]; out.push(total);"
    - level: 4
      message: |
        function runningSum(nums) {
          const out = [];
          let total = 0;
          for (const n of nums) {
            total += n;
            out.push(total);
          }
          return out;
        }
  reward: {xp: 35}
  requiresRun: false
  runtime:
    environment: worker
    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function runningSum(nums) {
        const out = [];
        let total = 0;
        for (const n of nums) {
          total += n;
          out.push(total);
        }
        return out;
      }
    acceptedSolutions:
      - name: mutate copy
        source: |
          function runningSum(nums) {
            const out = nums.slice();
            for (let i = 1; i < out.length; i++) out[i] += out[i - 1];
            return out;
          }
    rejectedSolutions:
      - name: returns original
        source: |
          function runningSum(nums) {
            return nums.slice();
          }
