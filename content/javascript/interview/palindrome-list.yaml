    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function isPalindrome(head) {
        let slow = head;
        let fast = head;
        while (fast && fast.next) {
          slow = slow.next;
          fast = fast.next.next;
        }
        let prev = null;
        while (slow) {
          const next = slow.next;
          slow.next = prev;
          prev = slow;
          slow = next;
        }
        let left = head;
        let right = prev;
        while (right) {
          if (left.val !== right.val) return false;
          left = left.next;
          right = right.next;
        }
        return true;
      }

      function demoPalindrome() {
        const d = { val: 1, next: null };
        const c = { val: 2, next: d };
        const b = { val: 2, next: c };
        const a = { val: 1, next: b };
        return isPalindrome(a);
      }

      function demoNot() {
        const b = { val: 2, next: null };
        const a = { val: 1, next: b };
        return isPalindrome(a);
      }

      function demoEndsMatch() {
        const d = { val: 1, next: null };
        const c = { val: 3, next: d };
        const b = { val: 2, next: c };
        const a = { val: 1, next: b };
        return isPalindrome(a);
      }
    acceptedSolutions:
      - name: array copy
        source: |
          function isPalindrome(head) {
            const vals = [];
            for (let node = head; node; node = node.next) vals.push(node.val);
            let left = 0;
            let right = vals.length - 1;
            while (left < right) {
              if (vals[left] !== vals[right]) return false;
              left += 1;
              right -= 1;
            }
            return true;
          }

          function demoPalindrome() {
            const d = { val: 1, next: null };
            const c = { val: 2, next: d };
            const b = { val: 2, next: c };
            const a = { val: 1, next: b };
            return isPalindrome(a);
          }

          function demoNot() {
            const b = { val: 2, next: null };
            const a = { val: 1, next: b };
            return isPalindrome(a);
          }

          function demoEndsMatch() {
            const d = { val: 1, next: null };
            const c = { val: 3, next: d };
            const b = { val: 2, next: c };
            const a = { val: 1, next: b };
            return isPalindrome(a);
          }
    rejectedSolutions:
      - name: first equals last only
        source: |
          function isPalindrome(head) {
            if (!head) return true;
            let tail = head;
            while (tail.next) tail = tail.next;
            return head.val === tail.val;
          }

          function demoPalindrome() {
            const d = { val: 1, next: null };
            const c = { val: 2, next: d };
            const b = { val: 2, next: c };
            const a = { val: 1, next: b };
            return isPalindrome(a);
          }

          function demoNot() {
            const b = { val: 2, next: null };
            const a = { val: 1, next: b };
            return isPalindrome(a);
          }

          function demoEndsMatch() {
            const d = { val: 1, next: null };
            const c = { val: 3, next: d };
            const b = { val: 2, next: c };
            const a = { val: 1, next: b };
            return isPalindrome(a);
          }
