id: js-interview-valid-palindrome
revision: 1
title: Valid Palindrome
summary: >-
  Clean alphanumeric characters, ignore case, then verify the string reads the
  same forward and backward with two pointers.
difficulty: easy
pattern: two-pointers
challenge:
  id: js-interview-valid-palindrome-001
  revision: 1
  language: javascript
  title: Valid Palindrome
  level: 10
  difficultyScore: 45
  instruction: |
    A phrase is a palindrome if, after converting all uppercase letters into
    lowercase letters and removing all non-alphanumeric characters, it reads the
    same forward and backward.

    Examples interviewers love:
    - "A man, a plan, a canal: Panama" -> true
    - "race a car" -> false

    Teaching goal:
    Show you can filter characters without building a reversed copy (optional),
    and compare from both ends. Building a cleaned string then reversing also
    works and is fine for this challenge.

    Complete `isPalindrome(s)`.
  starterCode: |
    function isPalindrome(s) {
      // Ignore non-alphanumeric; compare case-insensitively
    }
  skills: [javascript.algorithms_two_pointers, javascript.strings, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: isPalindrome}
    - {type: functionReturns, name: isPalindrome, args: ["A man, a plan, a canal: Panama"], value: true}
    - {type: functionReturns, name: isPalindrome, args: ["race a car"], value: false}
    - {type: functionReturns, name: isPalindrome, args: [" "], value: true}
    - {type: functionReturns, name: isPalindrome, args: ["0P"], value: false}
  hints:
    - level: 1
      message: >-
        Keep only characters matching /[a-z0-9]/i (or equivalent checks), lowercasing as you go.
    - level: 2
      message: >-
        Two pointers on the cleaned string: if left and right differ, return false; otherwise move inward.
    - level: 3
      message: >-
        Empty cleaned strings are palindromes. Watch digits — "0P" is not a palindrome.
    - level: 4
      message: |
        function isPalindrome(s) {
          const cleaned = [];
          for (const ch of s.toLowerCase()) {
            if ((ch >= "a" && ch <= "z") || (ch >= "0" && ch <= "9")) cleaned.push(ch);
          }
          let left = 0;
          let right = cleaned.length - 1;
          while (left < right) {
            if (cleaned[left] !== cleaned[right]) return false;
            left += 1;
            right -= 1;
          }
          return true;
        }
  reward: {xp: 40}
  requiresRun: false
  runtime: &workerRuntime
    environment: worker
    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function isPalindrome(s) {
        const cleaned = [];
        for (const ch of s.toLowerCase()) {
          if ((ch >= "a" && ch <= "z") || (ch >= "0" && ch <= "9")) cleaned.push(ch);
        }
        let left = 0;
        let right = cleaned.length - 1;
        while (left < right) {
          if (cleaned[left] !== cleaned[right]) return false;
          left += 1;
          right -= 1;
        }
        return true;
      }
    acceptedSolutions:
      - name: reverse compare
        source: |
          function isPalindrome(s) {
            const cleaned = s.toLowerCase().replace(/[^a-z0-9]/g, "");
            return cleaned === cleaned.split("").reverse().join("");
          }
    rejectedSolutions:
      - name: case sensitive raw
        source: |
          function isPalindrome(s) {
            return s === s.split("").reverse().join("");
          }
