    acceptedSolutions:
      - name: bfs floods
        source: |
          function pacificAtlantic(heights) {
            const rows = heights.length;
            const cols = heights[0].length;
            function flood(starts) {
              const seen = Array.from({ length: rows }, () => Array(cols).fill(false));
              const queue = starts.map(([r, c]) => {
                seen[r][c] = true;
                return [r, c];
              });
              while (queue.length) {
                const [r, c] = queue.shift();
                for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                  const nr = r + dr;
                  const nc = c + dc;
                  if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
                  if (seen[nr][nc] || heights[nr][nc] < heights[r][c]) continue;
                  seen[nr][nc] = true;
                  queue.push([nr, nc]);
                }
              }
              return seen;
            }
            const pacificStarts = [];
            const atlanticStarts = [];
            for (let r = 0; r < rows; r++) {
              pacificStarts.push([r, 0]);
              atlanticStarts.push([r, cols - 1]);
            }
            for (let c = 0; c < cols; c++) {
              pacificStarts.push([0, c]);
              atlanticStarts.push([rows - 1, c]);
            }
            const pacific = flood(pacificStarts);
            const atlantic = flood(atlanticStarts);
            const out = [];
            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                if (pacific[r][c] && atlantic[r][c]) out.push([r, c]);
              }
            }
            return out;
          }

          function sortedCells(heights) {
            return pacificAtlantic(heights)
              .map((cell) => cell.slice())
              .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
          }
    rejectedSolutions:
      - name: all cells
        source: |
          function pacificAtlantic(heights) {
            const out = [];
            for (let r = 0; r < heights.length; r++) {
              for (let c = 0; c < heights[0].length; c++) out.push([r, c]);
            }
            return out;
          }

          function sortedCells(heights) {
            return pacificAtlantic(heights)
              .map((cell) => cell.slice())
              .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
          }
