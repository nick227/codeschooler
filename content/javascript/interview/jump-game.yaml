id: js-interview-jump-game
revision: 2
title: Jump Game
summary: >-
  Greedy farthest-reach scan — at each index update how far you can get, and
  fail if the scan index ever moves past that frontier.
difficulty: medium
pattern: greedy
challenge:
  id: js-interview-jump-game-001
  revision: 2
  language: javascript
  title: Jump Game
  level: 10
  difficultyScore: 50
  instruction: |
    You start at index 0 of nums. From index i you may jump any distance in
    0..nums[i] (landing on a later index). Return true if you can reach the last
    index.

    Companion to Jump Game II (minimum jumps): here you only need reachability.

    Greedy idea:
    Track farthest = max index reachable so far. Scan i from 0 while i <= farthest.
    Update farthest = max(farthest, i + nums[i]). If farthest ever covers n-1,
    success. If the loop ends with farthest < n-1, fail.

    Examples: [2,3,1,1,4] true; [3,2,1,0,4] false.

    Complete `canJump(nums)`.
  starterCode: |
    function canJump(nums) {
      // Track farthest reachable index while scanning
    }
  skills: [javascript.algorithms_greedy, javascript.arrays, javascript.functions]
  guidance: independent
  checks:
    - {type: functionExists, name: canJump}
    - {type: functionReturns, name: canJump, args: [[2, 3, 1, 1, 4]], value: true}
    - {type: functionReturns, name: canJump, args: [[3, 2, 1, 0, 4]], value: false}
    - {type: functionReturns, name: canJump, args: [[0]], value: true}
    - {type: functionReturns, name: canJump, args: [[2, 0, 0]], value: true}
  hints:
    - level: 1
      message: >-
        Initialize farthest = 0. Loop i from 0 to nums.length-1 but stop if i > farthest.
    - level: 2
      message: >-
        farthest = Math.max(farthest, i + nums[i]).
    - level: 3
      message: >-
        Return farthest >= nums.length - 1 after (or during) the scan.
    - level: 4
      message: |
        function canJump(nums) {
          let farthest = 0;
          for (let i = 0; i < nums.length; i++) {
            if (i > farthest) return false;
            farthest = Math.max(farthest, i + nums[i]);
          }
          return true;
        }
  reward: {xp: 45}
  requiresRun: false
  runtime: &workerRuntime
    environment: worker
    timeoutMs: 2000
    maxOutputBytes: 16384
    capabilities: {network: false, storage: false, timers: false, dom: false}
  authoring:
    referenceSolution: |
      function canJump(nums) {
        let farthest = 0;
        for (let i = 0; i < nums.length; i++) {
          if (i > farthest) return false;
          farthest = Math.max(farthest, i + nums[i]);
        }
        return true;
      }
    acceptedSolutions:
      - name: walk backward
        source: |
          function canJump(nums) {
            let goal = nums.length - 1;
            for (let i = nums.length - 2; i >= 0; i--) {
              if (i + nums[i] >= goal) goal = i;
            }
            return goal === 0;
          }
    rejectedSolutions:
      - name: only checks nonzero cells
        source: |
          function canJump(nums) {
            return nums.every((n) => n > 0) || nums.length === 1;
          }
