    acceptedSolutions:
      - name: explicit doubly linked list nodes
        source: |
          function createLRUCache(capacity) {
            const map = new Map();
            const head = { key: null, value: null, prev: null, next: null };
            const tail = { key: null, value: null, prev: head, next: null };
            head.next = tail;

            function remove(node) {
              node.prev.next = node.next;
              node.next.prev = node.prev;
            }

            function addToTail(node) {
              node.prev = tail.prev;
              node.next = tail;
              tail.prev.next = node;
              tail.prev = node;
            }

            return {
              get(key) {
                if (!map.has(key)) return -1;
                const node = map.get(key);
                remove(node);
                addToTail(node);
                return node.value;
              },
              put(key, value) {
                if (map.has(key)) {
                  const node = map.get(key);
                  node.value = value;
                  remove(node);
                  addToTail(node);
                  return;
                }
                if (map.size === capacity) {
                  const oldest = head.next;
                  remove(oldest);
                  map.delete(oldest.key);
                }
                const node = { key, value, prev: null, next: null };
                addToTail(node);
                map.set(key, node);
              },
            };
          }

          function demoLRU() {
            const cache = createLRUCache(2);
            cache.put(1, 1);
            cache.put(2, 2);
            const a = cache.get(1);
            cache.put(3, 3);
            const b = cache.get(2);
            cache.put(4, 4);
            const c = cache.get(1);
            const d = cache.get(3);
            const e = cache.get(4);
            return [a, b, c, d, e];
          }

          function demoUpdateRefresh() {
            const cache = createLRUCache(2);
            cache.put(1, 1);
            cache.put(2, 2);
            cache.put(1, 2);
            cache.put(3, 3);
            return [cache.get(1), cache.get(2), cache.get(3)];
          }
