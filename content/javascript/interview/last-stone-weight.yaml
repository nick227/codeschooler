  authoring:
    referenceSolution: |
      function lastStoneWeight(stones) {
        const heap = stones.slice().sort((a, b) => a - b);
        while (heap.length > 1) {
          const y = heap.pop();
          const x = heap.pop();
          if (y !== x) {
            heap.push(y - x);
            heap.sort((a, b) => a - b);
          }
        }
        return heap.length ? heap[0] : 0;
      }
    acceptedSolutions:
      - name: sort each turn descending
        source: |
          function lastStoneWeight(stones) {
            const arr = stones.slice();
            while (arr.length > 1) {
              arr.sort((a, b) => b - a);
              const y = arr.shift();
              const x = arr.shift();
              if (y !== x) arr.push(y - x);
            }
            return arr.length ? arr[0] : 0;
          }
    rejectedSolutions:
      - name: returns max only
        source: |
          function lastStoneWeight(stones) {
            return Math.max(...stones);
          }
